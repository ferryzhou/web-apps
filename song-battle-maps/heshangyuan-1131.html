      <path class="march j" marker-end="url(#aj)" d="M 360,360 C 400,368 418,372 424,376"/>

      <text class="mlabel q" x="380" y="300">兀术倾兵十余万,悉锐来攻</text>
      <text class="anno" x="120" y="150">富平新败,关陇尽失;和尚原一垒,独扼蜀口</text>
    </g>

    <!-- 阶段一:驻队矢挫敌 -->
    <g id="ph1" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 600,200 C 540,260 480,320 448,364"/>

      <path class="march q rout" marker-end="url(#aq)" d="M 444,368 C 486,336 528,300 560,262"/>

      <circle class="star" cx="430" cy="378" r="10"/>
      <text class="mlabel j" x="130" y="360">吴玠据险,选劲弩分番迭射</text>
      <text class="anno" x="150" y="410">矢下如雨,号「驻队矢」;金军相蹂而退</text>
    </g>

    <!-- 阶段二:兀术倾兵 -->
    <g id="ph2" class="ph">
      <rect class="camp" x="352" y="240" width="9" height="9" transform="rotate(45 356 244)"/>
      <rect class="camp" x="392" y="236" width="9" height="9" transform="rotate(45 396 240)"/>
      <rect class="camp" x="432" y="234" width="9" height="9" transform="rotate(45 436 238)"/>
      <rect class="camp" x="472" y="234" width="9" height="9" transform="rotate(45 476 238)"/>
      <rect class="camp" x="512" y="236" width="9" height="9" transform="rotate(45 516 240)"/>
      <text class="mlabel q" x="340" y="226">自宝鸡结连珠营,垒石为道,绵亘数十里</text>
      <path class="march q" marker-end="url(#aq)" d="M 460,246 C 452,296 444,340 436,368"/>
      <text class="anno" x="466" y="300">造浮梁跨渭而进,悉锐攻和尚原</text>
      <path class="march j" marker-end="url(#aj)" d="M 415,384 C 408,404 400,420 396,432"/>
      <text class="mlabel j" x="240" y="440">吴玠、吴璘分军轮战,昼夜拒守</text>
    </g>

    <!-- 阶段三:神岔设伏 · 大捷 -->
    <g id="ph3" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 442,384 C 480,398 512,410 530,416"/>

      <circle class="star" cx="540" cy="420" r="9"/>
      <path class="march rout" marker-end="url(#ar)" d="M 452,372 C 500,320 552,260 596,208"/>

      <text class="anno" x="150" y="470">兀术身中流矢,剃须易服而遁,仅以身免</text>
      <text class="anno" x="150" y="490">此为宋兴以来对金第一大捷,蜀口以安</text>
    </g>

    <g class="compass" transform="translate(944,560)">

      <path d="M 0,-20 L 4,0 L 0,16 L -4,0 Z" fill="var(--ink2)"/>
      <path d="M 0,20 L 4,0 L -4,0 Z" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <text x="-4" y="-24">北</text>
    </g>
  </svg>
  </div>

    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#9a2b1e" stroke-width="3"/></svg>金军(兀术)</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>金军溃退</span>

  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《宋史·吴玠传》《吴璘传》《金史·宗弼传》及《建炎以来系年要录》卷四四至四七约略绘出。疆界、水道、连珠营位置皆经简化,非实测画界。</p>
    <p><span class="n">注二</span>和尚原在今陕西宝鸡西南、大散关之东,当川陕孔道之冲;凤翔、宝鸡在渭水之北,为金军基地与结营跨渭之所。</p>
    <p><span class="n">注三</span>吴玠据险不出,以「驻队矢」分番迭射,又断粮设伏,以少破众;和尚原、仙人关之守,保全蜀口,南宋西陲赖以安。本图以宋为本方(青),金军溃退用褐。</p>

<script>
const PH={
  all:{t:"扼守和尚原",d:"宋绍兴元年(1131)",p:["富平之败,关陇尽失,宋师星散。吴玠、吴璘收合散卒,据和尚原为垒——原当大散关之东,扼川陕孔道之冲,得之则蜀口有蔽,失之则全蜀动摇,故必死守之。","金兀术不欲留此一梗,倾兵十余万,自宝鸡而进,悉锐来攻。二吴凭险列阵,誓与此原共存亡,遂成宋金相持之大战。"]},
  "1":{t:"驻队矢挫敌",d:"绍兴元年·先锋来犯",p:["金将没立自凤翔、乌鲁折合自阶成,分道先攻和尚原。吴玠据险不轻出,选劲弩数千,分为数番,更迭而射,矢下如雨,谓之「驻队矢」——一番矢尽,一番继之,箭注不绝。","金军仰攻险隘,不能上,死伤山积,先挫其锋。没立、折合两军皆败,不能合。金人始知此原之不易拔,兀术乃自将大兵继之。"]},
  "2":{t:"兀术倾兵",d:"绍兴元年·十月",p:["兀术自将十余万众,自宝鸡结连珠之营,垒石为道,绵亘数十里,又造浮梁跨渭水而进,尽锐悉攻和尚原,声势极盛。","吴玠、吴璘据险分军,更番轮战,昼夜拒守。金军攻围日急,而原上宋师坚忍不动,弩矢迭发,金人虽众,顿兵坚城之下,锐气渐衰,粮道且长。"]},
  "3":{t:"神岔设伏 · 大捷",d:"绍兴元年·十月",p:["吴玠察金军师老粮匮,乃遣奇兵绝其粮道,又设伏于神岔沟险要;俟金军疲惫,乘夜纵击。金军仓皇不能成列,自相蹂践,死者山积,弃甲如丘。","兀术身中流矢,狼狈剃须易服,仅以身免而遁。是役,金人自南下以来未有此败,为宋兴以来对金第一大捷。蜀口以此获安,二吴之名遂震天下。"]}
};
const CITY={
  heshangyuan:{t:"和尚原",d:"决战险地,今陕西宝鸡西南",p:["当大散关之东,扼川陕之冲。吴玠、吴璘据以为垒,以「驻队矢」迭射破金先锋,又拒兀术十余万之众,卒成大捷。"]},
  dasanguan:{t:"大散关",d:"秦岭险口",p:["秦岭入蜀之要隘,和尚原在其东。守此则蜀口有蔽;二吴据原扼关,金军虽众而不得逾。"]},
  baoji:{t:"宝鸡",d:"金军结营跨渭,渭水之北",p:["兀术自此进兵,结连珠营、垒石为道、造浮梁跨渭而南,绵亘数十里,悉锐攻和尚原。"]},
  weishui:{t:"渭水",d:"横贯关中,自西而东",p:["关中大川。金军造浮梁跨渭而进,以通宝鸡之师;吴玠断其粮道,即扼此水陆之运。"]},
  fengxiang:{t:"凤翔",d:"金军基地,渭水之北",p:["金人经营关中之重镇。没立自凤翔来攻和尚原,先为吴玠「驻队矢」所败。"]},
  shenchagou:{t:"神岔沟",d:"吴玠设伏处",p:["和尚原东南险沟。吴玠断金粮道后,设伏于此,乘金军疲惫夜击之,金师大溃,兀术中矢遁走。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

    <p><span class="n">注一</span>本图为示意图,依《宋史·太宗纪》《辽史·景宗纪》《辽史·耶律休哥传》《续资治通鉴长编》卷二十约略绘出。疆界、水道经简化,拒马河、沙河、高梁河诸水但示大势,非实测。</p>
    <p><span class="n">注二</span>幽州即今北京,辽为南京析津府;高梁河在其西直门外。宋自镇州(真定,今河北正定)北伐,历易州、涿州、岐沟关而抵幽州城下。</p>
    <p><span class="n">注三</span>太宗灭北汉,不恤师、乘疲攻坚而轻辽援,遂有此败;「驴车」南遁为后世所讥。本图以宋为本方(青),辽为敌方(红),宋军溃退用褐。</p>

<script>
const PH={
  all:{t:"乘胜攻辽",d:"太平兴国四年(979)夏",p:["太宗既平北汉,自谓兵威方盛,乃不休疲卒,转兵北向,欲乘势收复燕云十六州。诸将有请赏北汉之功者,帝不许,径趣幽州。","辽景宗闻宋师入境,遣南院大王耶律沙率兵拒战,又遣惕隐耶律休哥、南院大王耶律斜轸将精骑继进赴援,屯于幽州之北,伺宋军疲敝而后动。"]},
  "1":{t:"长驱围幽",d:"太平兴国四年六月",p:["宋军自镇州北上,长驱燕南。辽守将或降或溃,连下易州、涿州,兵锋直抵幽州城下,四面围之。","幽州(辽南京)城坚池深,守将韩德让、耶律学古婴城固守。宋军日夜攻之而不能拔,顿兵坚城之下者旬余,士卒暴露疲乏,而帝督战益急,不知休息。"]},
  "2":{t:"高梁河遇援",d:"太平兴国四年七月",p:["辽耶律沙先至,与宋军战于高梁河。宋师奋击,沙军小却,几为所乘。","会耶律休哥、耶律斜轸各以精骑自间道左右并进,夹击宋阵。时已昏暮,辽骑衔枚疾驰,人持两炬,火光烛天;宋军不测其众寡,阵脚遂动。"]},
  "3":{t:"太宗遁走",d:"太平兴国四年七月",p:["两军大战,自昏达夜。宋师阵乱,前后不相属,自相蹂践,一夕大溃,死者万计,委弃兵甲、辎重、符印不可胜数。","太宗身中两箭,仓皇南奔,失其乘舆,得驴车一乘,乘之遁归。辽军乘胜追至涿州而还。复燕云之谋自是大挫,南北攻守之势亦为之一变。"]}
};
const CITY={
  youzhou:{t:"幽州(辽南京)",d:"辽南京析津府,今北京",p:["辽之南京,燕云重镇。宋军围之旬余不下,顿兵疲师,遂启高梁河之败。"]},
  gaoliang:{t:"高梁河",d:"幽州西直门外",p:["宋辽决战之地。耶律沙先拒于此,休哥、斜轸左右夹击,乘夜衔枚,人持两炬,宋军大溃。"]},
  zhuozhou:{t:"涿州",d:"今河北涿州",p:["宋军北上所下,进围幽州之途所经。高梁河败后,辽军追蹑宋师至此乃还。"]},
  qigou:{t:"岐沟关",d:"涿州西南,拒马河上",p:["宋辽往来要冲。太平兴国四年为北伐所经;后雍熙三年曹彬亦大败于此。"]},
  yizhou:{t:"易州",d:"今河北易县",p:["宋军北伐所下之州,燕南门户。由此北趋涿州、幽州。"]},
  zhenzhou:{t:"镇州·真定",d:"今河北正定",p:["宋军北伐出兵之基地。太宗自太原东进,顿于镇州,乃议北取幽州。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

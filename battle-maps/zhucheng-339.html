  <header>
    <h1>邾城之战</h1>
    <div class="sub">晋咸康五年(339)　　<b>后赵 石虎</b>(夔安·张貉) 攻 <i>东晋 毛宝 · 樊峻</i>(守邾城)</div>

  <div class="mapwrap">
  <svg class="map" viewBox="0 0 1000 640" role="img" aria-label="邾城之战形势图,含东晋后赵疆界、长江沔水汉水与邾城武昌江陵等城邑">
    <defs>

    <path d="M 0,300 C 120,288 240,276 360,272 C 480,268 600,278 720,266 C 840,256 920,250 1000,256 L 1000,0 L 0,0 Z" fill="url(#qinHatch)"/>

    <text class="realm q" x="120" y="120" font-size="32">后 赵(沔汉之北)</text>
    <text class="realm j" x="640" y="592" font-size="30">东 晋(江南)</text>

    <path class="river" stroke-width="5.5" d="M 0,360 C 120,372 240,392 360,400 C 480,408 600,406 720,398 C 840,390 920,392 1000,398"/>

    <text class="rname" x="206" y="240" transform="rotate(68 206 240)">沔水(汉水)</text>

    <text class="cname s" x="558" y="320">大别诸山</text>

    <!-- 城邑 -->
    <g id="cities">
      <g class="city" data-city="jiangling"><circle cx="120" cy="378" r="5"/><text class="cname" x="60" y="374">江陵<tspan class="cname s" dx="2">(荆州)</tspan></text></g>
      <g class="city" data-city="mianshui"><circle cx="250" cy="320" r="3"/><text class="cname s" x="258" y="314">沔南诸城</text></g>
      <g class="city" data-city="mianyin"><circle cx="330" cy="334" r="4"/><text class="cname s" x="338" y="330">沔阴</text></g>
      <g class="city" data-city="shicheng"><circle cx="470" cy="346" r="4"/><text class="cname s" x="430" y="338">石城</text></g>
      <g class="city cap" data-city="zhucheng"><circle cx="660" cy="356" r="6.5"/><text class="cname" x="600" y="350">邾城<tspan class="cname s" dx="2">(江北孤城)</tspan></text></g>
      <g class="city" data-city="jiangxia"><circle cx="560" cy="430" r="4"/><text class="cname s" x="500" y="446">江夏</text></g>
      <g class="city cap" data-city="wuchang"><circle cx="672" cy="448" r="6"/><text class="cname" x="684" y="452">武昌<tspan class="cname s" dx="2">(庾亮镇)</tspan></text></g>
    </g>

    <!-- 全图 · 石赵南侵 -->
    <g id="phAll" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 240,150 C 300,210 380,270 440,320"/>
      <path class="march q" marker-end="url(#aq)" d="M 500,150 C 540,210 580,280 630,340"/>
      <text class="mlabel q" x="300" y="150">石虎遣五将,众数万南侵沔汉</text>
      <text class="anno" x="430" y="300">夔安·李农·石闵·张貉·李菟</text>
      <text class="mlabel j" x="610" y="476">庾亮镇武昌,经营江北、谋北伐</text>
      <text class="anno" x="588" y="372">邾城孤悬江北,毛宝、樊峻万人戍守</text>
    </g>

    <!-- 阶段一:沔南崩坏 -->
    <g id="ph1" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 230,160 C 250,220 268,280 286,322"/>
      <text class="mlabel q" x="232" y="180">夔安、李农攻陷沔南诸城</text>
      <rect class="camp" x="246" y="316" width="8" height="8" transform="rotate(45 250 320)"/>
      <path class="march q" marker-end="url(#aq)" d="M 420,150 C 400,220 372,290 342,328"/>
      <circle class="star" cx="330" cy="334" r="7"/>
      <text class="mlabel q" x="346" y="358">石闵败晋军于沔阴,斩将军蔡怀</text>
      <text class="anno" x="220" y="356">朱保败晋兵于白石,获郑豹等五将</text>
      <text class="anno" x="300" y="384">晋之江北外围尽失,邾城益孤</text>
    </g>

    <!-- 阶段二:孤城被围 -->
    <g id="ph2" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 480,300 C 540,316 600,336 644,352"/>
      <text class="mlabel q" x="476" y="296">张貉率部专攻邾城</text>
      <circle class="siege" cx="660" cy="356" r="20"/>
      <text class="anno" x="600" y="332">毛宝、樊峻闭城固守</text>
      <path class="march j rout" marker-end="url(#aj)" d="M 666,366 C 670,392 672,416 672,438"/>
      <text class="mlabel j" x="684" y="404">屡遣使渡江告急求援</text>
      <text class="anno" x="560" y="476">庾亮恃城险固,不时发兵,救援迟迟不至</text>
    </g>

    <!-- 阶段三:突围溺江 -->
    <g id="ph3" class="ph">
      <path d="M 660,356 l 5,-11 l 4,8 l 9,-5 l -5,9 l 11,4 l -11,4 l 5,9 l -9,-5 l -4,8 l -5,-11 l -9,5 l 5,-9 l -11,-4 l 11,-4 l -5,-9 z" fill="#9a2b1e" stroke="#e9dec4" stroke-width=".8"/>
      <text class="mlabel q" x="600" y="324">邾城终为后赵攻破</text>
      <path class="march rout" marker-end="url(#ar)" d="M 660,368 C 656,382 652,392 648,398"/>
      <text class="mlabel r" x="612" y="392">弃城突围赴江</text>
      <text class="anno" x="560" y="418">六千余众赴江欲渡,人马溺死者六千</text>
      <text class="anno" x="500" y="436">毛宝亦没于江,江北尽失</text>
      <text class="anno" x="610" y="478">庾亮经营江北、北伐之谋大挫,上疏自贬</text>
    </g>

    <g class="compass" transform="translate(944,560)">
      <circle r="20" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <path d="M 0,-20 L 4,0 L 0,16 L -4,0 Z" fill="var(--ink2)"/>
      <path d="M 0,20 L 4,0 L -4,0 Z" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <text x="-4" y="-24">北</text>
    </g>
  </svg>
  </div>
  <div class="legend">
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#1f4e54" stroke-width="3"/></svg>东晋军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#9a2b1e" stroke-width="3"/></svg>后赵军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>突围溺江</span>
    <span class="item"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#9c7a2c" stroke-width="2"/></svg>会战</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#qinHatch)"/></svg>后赵</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#jinHatch)"/></svg>东晋</span>

  <div class="panel" id="panel" aria-live="polite"></div>
  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷九六、《晋书·成帝纪》《庾亮传》约略绘出。邾城今湖北黄冈西北,武昌即今鄂州,沔水即汉水。水道、城邑位置为相对示意,经简化。</p>
    <p><span class="n">注二</span>邾城孤悬江北,陆抗、桓温辈皆尝言其难守;庾亮锐意经营江北、谋移镇石城以图北伐,毛宝固谏不可置兵邾城而不能止,卒有此败。</p>
    <p><span class="n">注三</span>此役晋丧师六千,江北经营之谋顿挫,庾亮忧惭发病,明年卒。后赵则气焰益张,然亦未能渡江南下。</p>

<script>
const PH={
  all:{t:"石赵南侵",d:"晋咸康五年(339)",p:["征西将军庾亮镇武昌,谋经营江北、北伐中原,使豫州刺史毛宝、西阳太守樊峻以万人戍邾城——城在长江北岸,正对江南之武昌,孤悬于敌境之前。","后赵天王石虎遣夔安、李农、石闵(冉闵)、张貉、李菟等五将,率众数万南侵荆襄沔汉之地。矛头直指江北邾城,庾亮经营江北之局面临崩坏。"]},
  "1":{t:"沔南崩坏",d:"咸康五年九月",p:["夔安、李农等长驱南下,攻陷沔南诸城;石闵(冉闵)进而败晋军于沔阴,斩晋将军蔡怀,沔汉东路为之震动。","朱保又败晋兵于白石,擒获郑豹等五将。晋之江北外围尽失,邾城遂成绝域之中一孤垒。"]},
  "2":{t:"孤城被围",d:"咸康五年九月",p:["张貉率所部专攻邾城,昼夜环逼。毛宝、樊峻闭城固守,屡遣使渡江,向江南武昌之庾亮告急求援。","庾亮恃邾城险固,以为足以自守,虽不时发兵,而救援之师迟迟不至。孤城外无强援,势日危蹙。"]},
  "3":{t:"突围溺江",d:"咸康五年九月",p:["邾城终为后赵攻破。毛宝、樊峻率六千余众弃城突围,争赴江岸欲南渡。然舟楫不给,后骑相蹙,人马溺死于江者六千,毛宝亦没于水中。","江北之地尽失,庾亮经营江北、北伐中原之谋大挫。亮上疏自贬,忧愧成疾,明年(340)遂卒。"]}
};
const CITY={
  zhucheng:{t:"邾城",d:"江北孤城,今湖北黄冈西北",p:["毛宝、樊峻所守。孤悬长江北岸,正对江南武昌。城破之后,众六千余突围赴江,溺死殆尽,毛宝亦没于江。"]},
  wuchang:{t:"武昌",d:"庾亮镇,今湖北鄂州",p:["征西将军庾亮治所,在大江之南,与邾城隔江相望。亮恃城险而救援不及,坐视江北之失。"]},
  mianyin:{t:"沔阴",d:"沔水之南",p:["石闵(冉闵)败晋军于此,斩晋将军蔡怀。沔阴既失,沔汉之防摇动。"]},
  jiangxia:{t:"江夏",d:"今湖北武汉一带",p:["大江南岸要郡,与邾城对岸相为唇齿。邾城既破,江夏首当其冲。"]},
  shicheng:{t:"石城",d:"江北沔汉之间",p:["庾亮尝谋移镇于此,以为经营江北、北伐之根本;毛宝固谏不可,事终不行。"]},
  mianshui:{t:"沔水(汉水)",d:"自西北南流入江",p:["夔安、李农攻陷沔南诸城,赵军循沔南下,直逼大江之北。"]},
  jiangling:{t:"江陵",d:"荆州治,今湖北荆州",p:["荆州治所,上游重镇。庾亮经营江北、图谋北伐之所本,亦其退守之凭。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

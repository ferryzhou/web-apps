      <path class="march q" marker-end="url(#aq)" d="M 540,330 C 500,300 420,260 300,210"/>
      <text class="mlabel q" x="380" y="244">以羌将姚襄为前驱,而姚襄已生贰心</text>
      <text class="anno" x="150" y="150">许、洛者,北伐所图之故都也</text>
      <text class="anno" x="430" y="470">浩都督五州军事,出师中原</text>

      <text class="anno" x="170" y="262">谢尚战于颍水之诫桥,大败,死者万五千</text>

      <path class="march rout" marker-end="url(#ar)" d="M 596,366 C 600,368 604,372 604,374"/>
      <text class="mlabel r" x="606" y="392">浩大败,弃辎重,狼狈退保谯城</text>

      <text class="mlabel q" x="470" y="300">姚襄尽收浩军资,遣使罪状之</text>

      <text class="anno" x="430" y="470">桓温久衔殷浩,因败上疏极言其罪</text>

  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷九九、《晋书·殷浩传》《姚襄载记》约略绘出。寿春今安徽寿县,谯城今亳州,山桑今蒙城北。淮、颍、涡诸水及城邑经简化,位置相对示意。</p>
    <p><span class="n">注二</span>殷浩书生典戎,无将略;用降人姚襄为前驱而又忌克谋之,逼反前驱,自取败亡。北伐两出,谢尚败于许昌,殷浩败于山桑。</p>
    <p><span class="n">注三</span>殷浩既废,朝廷再无可与桓温抗者,征伐大权遂归桓温,东晋政局为之一变。姚襄后南北流转,终为桓温所败,西入关中为苻氏所杀,弟姚苌后建后秦。</p>

<script>
const PH={
  all:{t:"寿春北出",d:"永和八年 — 九年",p:["会稽王司马昱引殷浩参综朝政,以抗桓温。值冉魏既亡、北方大乱,殷浩都督扬豫徐兖青五州军事,出师北伐,谋复许、洛。以羌族降将姚襄为前驱,屯于淮上。","姚襄者,羌酋姚弋仲之子,屡建战功而为殷浩所忌,数欲图杀之,襄遂怀怨。此图总览北伐军自寿春沿涡、颍北上、目标许洛,而前驱姚襄已生贰心之形势——祸根在内,败兆已具。"]},
  "1":{t:"谢尚先挫",d:"永和八年(352)",p:["殷浩出屯泗口,遣中军将军谢尚、安西将军姚襄等进取许昌、洛阳。会降将张遇据许昌复叛,引前秦兵以拒晋师。","谢尚与张遇战于颍水之诫桥(在许昌之南),晋军大败,死者万五千,谢尚奔还。殷浩闻败,退屯寿春——北伐首出,锋未交于洛而已折于颍上。"]},
  "2":{t:"山桑夜袭",d:"永和九年(353)",p:["殷浩复率众七万,自寿春再举北伐,进次谯城,谋直指洛阳。仍先遣姚襄为前驱,使居前列。","姚襄怨望既深,遂反于山桑,设伏以待;夜袭殷浩之军,浩仓皇大败,弃辎重、委甲仗军资无算,狼狈退保谯城,士卒死散十之四五。书生之师,一夕而溃。"]},
  "3":{t:"坐废为民",d:"永和九年(353)",p:["姚襄尽收殷浩军资,据芍陂、盱眙,遣使上表,历数殷浩之罪。一时北伐之军资人众,反资叛将。","桓温久衔殷浩,因其败,上疏极言其罪。殷浩竟坐废为庶人,徙于东阳郡信安县。自是内外大权尽归桓温——北伐遂以一败而易主柄,东晋政局为之一变。"]}
};
const CITY={
  shouchun:{t:"寿春",d:"殷浩北伐基地,今安徽寿县",p:["殷浩开府北伐之本,临淮要冲。两出北伐皆自此发,败亦退保于此。"]},
  sikou:{t:"泗口",d:"泗水入淮之口",p:["永和八年殷浩出屯于此,遣谢尚、姚襄等分道进取许、洛。"]},
  qiaocheng:{t:"谯城",d:"殷浩进次、败退保守处,今安徽亳州",p:["在涡水之上,淮北重镇。殷浩再伐进次于此;山桑夜败后,狼狈退保此城。"]},
  shansang:{t:"山桑",d:"姚襄设伏夜袭处,谯城附近(今蒙城北)",p:["姚襄怨叛,反于此地,设伏夜袭殷浩军,浩大败弃辎重——北伐倾覆之所。"]},
  xuchang:{t:"许昌",d:"谢尚败于其南之诫桥",p:["北伐所图中原重镇。降将张遇据之复叛,引前秦兵;谢尚战于城南诫桥而大败。"]},
  luoyang:{t:"洛阳",d:"北伐目标故都",p:["晋之旧都,殷浩两出北伐所悬之的;然师未及洛而再折,终成画饼。"]},
  jiaoqiao:{t:"诫桥",d:"颍水之上,许昌之南",p:["永和八年谢尚与张遇决战之地。晋军大败,死者万五千,首出之师遂折。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷一〇四、《晋书·谢玄传》约略绘出。三阿在今江苏金湖、高邮间,盱眙、淮阴在淮水之滨,广陵即今扬州。淮水、长江及城邑经简化,位置相对示意。</p>
    <p><span class="n">注二</span>此役与襄阳之围同时,为前秦灭晋前之东路试探。谢玄所将,即太元二年组建之北府兵;四战四捷,全歼其众,北府劲旅之名自此始著,为四年后淝水大捷之先声。</p>
    <p><span class="n">注三</span>战后彭超、俱难皆为苻坚切责,贬黜有差;前秦东路受挫,然苻坚仍锐意南图,卒有淝水之举。</p>

<script>
const PH={
  all:{t:"秦逼三阿",d:"晋太元四年(379)",p:["前秦既图襄阳,复出东路:兖州刺史彭超、后将军俱难及毛盛、毛当、王显等众数万南下,攻彭城,克下邳、淮阴、盱眙,进据三阿。其前锋去广陵才百里,京师震动,中外戒严,诏沿江列戍以备。","时谢玄以兖州刺史镇广陵,所将乃太元二年新练之北府精兵。朝廷假玄节,使自广陵北上赴救——一场以新军当秦锋的淮南鏖战,自此开端。"]},
  "1":{t:"秦军南压",d:"太元四年·春夏",p:["彭超先围彭城,晋戴遁等度不能守,弃城南走;俱难等乘势长驱,连下下邳、淮阴、盱眙诸城,沿泗、淮而南。秦军遂据三阿——其地在高邮西北,距广陵不过百里。","建康闻警大震,诏沿江列戍,中外戒严。谢玄不待秦军近江,自广陵率北府兵北进赴救,直趋三阿,与秦前锋相值。"]},
  "2":{t:"连破三阿",d:"太元四年·夏",p:["谢玄率何谦、田洛等将进击,先与秦军大战于三阿,北府新军锐不可当,一举破之。秦军失利,敛众退保盱眙。","玄不予喘息,进军盱眙,复与秦战,又败其众。秦军再不能支,弃盱眙北退淮阴——两战两捷,淮南之势顿易。"]},
  "3":{t:"君川全捷",d:"太元四年·夏",p:["谢玄遣何谦、刘牢之等率舟师夜渡,焚淮阴泗口之淮桥,断秦归路,阵斩擒其将邵保。秦军震骇北遁,玄复挥军追蹑,及之于君川。","君川一战,三战三捷,大破俱难、彭超,秦军死伤略尽,主将仅以身免,前后损众六万余。北府兵威名由是大著;彭超、俱难亦为苻坚坐贬。此捷虽小，实开淝水之先声。"]}
};

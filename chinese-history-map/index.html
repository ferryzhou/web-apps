<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国历史地图 · Chinese History Map</title>
  <meta name="description" content="数据驱动的中国历史交互地图：拖动时间轴，查看历代疆域、人物、地点与事件。" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>中国历史地图 <span class="en">Chinese History Map</span></h1>
  </header>

  <section class="timeline" aria-label="时间轴">
    <div class="timeline-top">
      <button id="play" aria-pressed="false">▶ 播放</button>
      <span id="year" aria-live="polite"></span>
    </div>
    <div id="points" class="points" role="group" aria-label="历史时间点" tabindex="0"></div>
  </section>

  <main class="stage">
    <div id="map"></div>
    <aside id="detail" aria-label="详情" hidden></aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>

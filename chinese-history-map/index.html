<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Historical Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 15px 0;
        }

        h1 {
            font-size: 2.2rem;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 8px;
        }

        h1 span {
            font-size: 1.4rem;
            color: #e0e0e0;
        }

        .period-display {
            font-size: 1.6rem;
            color: #ff6b6b;
            margin: 8px 0;
        }

        .period-years {
            font-size: 1.1rem;
            color: #aaa;
        }

        /* Timeline Styles */
        .timeline-container {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .timeline-wrapper {
            position: relative;
            padding: 15px 0;
        }

        .timeline-track {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            position: relative;
        }

        .timeline-progress {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd700);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .timeline-slider {
            width: 100%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            -webkit-appearance: none;
            background: transparent;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(255,215,0,0.5);
        }

        .timeline-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: #ffd700;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #888;
            flex-wrap: wrap;
            gap: 5px;
        }

        .timeline-label {
            text-align: center;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 5px;
            transition: all 0.2s;
            flex: 1;
            min-width: 60px;
        }

        .timeline-label:hover {
            background: rgba(255,255,255,0.1);
            color: #ffd700;
        }

        .timeline-label.active {
            color: #ffd700;
            font-weight: bold;
            background: rgba(255,215,0,0.1);
        }

        /* Map Styles */
        .map-container {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 10px;
        }

        .map-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .legend-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .legend-item.selected {
            background: rgba(255,215,0,0.2);
            border: 1px solid #ffd700;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .legend-name {
            font-size: 0.85rem;
        }

        /* Info Panel Styles */
        .info-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
        }

        .info-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255,215,0,0.3);
            flex-wrap: wrap;
        }

        .kingdom-name {
            font-size: 1.8rem;
            color: #ffd700;
        }

        .kingdom-name-chinese {
            font-size: 1.3rem;
            color: #ff6b6b;
        }

        .kingdom-duration {
            font-size: 1rem;
            color: #aaa;
        }

        .info-content {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .info-section {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
        }

        .info-section h3 {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-section h3::before {
            content: '';
            width: 4px;
            height: 18px;
            background: #ff6b6b;
            border-radius: 2px;
        }

        .description {
            line-height: 1.7;
            color: #ccc;
            font-size: 0.95rem;
        }

        .events-list, .characters-list {
            list-style: none;
        }

        .events-list li, .characters-list li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem;
        }

        .events-list li:last-child, .characters-list li:last-child {
            border-bottom: none;
        }

        .event-year {
            color: #ff6b6b;
            font-weight: bold;
            margin-right: 8px;
        }

        .character-name {
            color: #ffd700;
            font-weight: bold;
        }

        .character-title {
            color: #888;
            font-size: 0.85rem;
            margin-left: 8px;
        }

        .character-desc {
            color: #aaa;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .placeholder-message {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 1.1rem;
        }

        .instructions {
            text-align: center;
            padding: 8px;
            color: #888;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.6rem;
            }
            h1 span {
                font-size: 1rem;
                display: block;
            }
            .period-display {
                font-size: 1.2rem;
            }
            #map {
                height: 400px;
            }
            .timeline-label {
                font-size: 0.6rem;
                padding: 4px;
                min-width: 50px;
            }
            .kingdom-name {
                font-size: 1.4rem;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        /* Custom info window */
        .gm-style-iw {
            background: #1a1a2e !important;
        }
        .gm-style-iw-d {
            overflow: hidden !important;
        }
        .map-info-window {
            padding: 10px;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }
        .map-info-window h4 {
            color: #ffd700;
            margin-bottom: 5px;
        }
        .map-info-window p {
            color: #ccc;
            font-size: 0.9rem;
        }
    </style>
</head>

        const periodYearsEl = document.getElementById('period-years');

        // Initialize Google Map
        function initMap() {
            const period = historicalData.periods[currentPeriodIndex];

            map = new google.maps.Map(document.getElementById('map'), {
                center: period.center,
                zoom: period.zoom,
                styles: [
                    { elementType: 'geometry', stylers: [{ color: '#1d2c4d' }] },
                    { elementType: 'labels.text.fill', stylers: [{ color: '#8ec3b9' }] },
                    { elementType: 'labels.text.stroke', stylers: [{ color: '#1a3646' }] },
                    { featureType: 'administrative.country', elementType: 'geometry.stroke', stylers: [{ color: '#4b6878' }] },
                    { featureType: 'administrative.province', elementType: 'geometry.stroke', stylers: [{ color: '#4b6878' }] },
                    { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0e1626' }] },
                    { featureType: 'water', elementType: 'labels.text.fill', stylers: [{ color: '#4e6d70' }] },
                    { featureType: 'road', stylers: [{ visibility: 'off' }] },
                    { featureType: 'poi', stylers: [{ visibility: 'off' }] },
                    { featureType: 'transit', stylers: [{ visibility: 'off' }] }
                ],
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: true
            });

            infoWindow = new google.maps.InfoWindow();

            initTimelineLabels();
            updatePeriod();
        }

        // Initialize Timeline Labels
        function initTimelineLabels() {
            timelineLabels.innerHTML = '';
            historicalData.periods.forEach((period, index) => {
                const label = document.createElement('div');
                label.className = 'timeline-label' + (index === currentPeriodIndex ? ' active' : '');
                label.innerHTML = `<div>${period.chinese}</div><div>${period.name}</div>`;
                label.addEventListener('click', () => {
                    currentPeriodIndex = index;
                    timelineSlider.value = index;
                    updatePeriod();
                });
                timelineLabels.appendChild(label);
            });
        }

        // Update Period Display
        function updatePeriod() {
            const period = historicalData.periods[currentPeriodIndex];

            // Update header
            periodNameEl.textContent = `${period.name} ${period.chinese}`;
            periodYearsEl.textContent = period.years;

            // Update timeline
            const progress = (currentPeriodIndex / (historicalData.periods.length - 1)) * 100;
            timelineProgress.style.width = `${progress}%`;

            // Update timeline labels
            document.querySelectorAll('.timeline-label').forEach((label, index) => {
                label.classList.toggle('active', index === currentPeriodIndex);
            });

            // Clear selection
            selectedKingdom = null;

            // Update map
            updateMap();

            // Update info panel
            updateInfoPanel();
        }

        // Update Map with kingdoms
        function updateMap() {
            const period = historicalData.periods[currentPeriodIndex];

            // Clear existing polygons and markers
            polygons.forEach(p => p.setMap(null));
            markers.forEach(m => m.setMap(null));
            polygons = [];
            markers = [];

            // Add kingdom polygons
            period.kingdoms.forEach(kingdom => {
                const polygon = new google.maps.Polygon({
                    paths: kingdom.coordinates,
                    strokeColor: kingdom.color,
                    strokeOpacity: 0.9,
                    strokeWeight: 3,
                    fillColor: kingdom.color,
                    fillOpacity: 0.4,
                    map: map
                });

                polygon.kingdomId = kingdom.id;

                // Add click listener
                polygon.addListener('click', (event) => {
                    selectKingdom(kingdom.id);
                });

                // Add hover effects
                polygon.addListener('mouseover', () => {
                    if (selectedKingdom !== kingdom.id) {
                        polygon.setOptions({ fillOpacity: 0.6, strokeWeight: 4 });
                    }
                });

                polygon.addListener('mouseout', () => {
                    if (selectedKingdom !== kingdom.id) {
                        polygon.setOptions({ fillOpacity: 0.4, strokeWeight: 3 });
                    }
                });

                polygons.push(polygon);

                // Add capital marker
                if (kingdom.capital) {
                    const marker = new google.maps.Marker({
                        position: kingdom.capital,
                        map: map,
                        title: kingdom.capital.name,
                        icon: {
                            path: google.maps.SymbolPath.CIRCLE,
                            scale: 8,
                            fillColor: '#ffd700',
                            fillOpacity: 1,
                            strokeColor: '#fff',
                            strokeWeight: 2
                        }
                    });

                    marker.addListener('click', () => {
                        infoWindow.setContent(`
                            <div class="map-info-window">
                                <h4>${kingdom.name} (${kingdom.chinese})</h4>
                                <p>Capital: ${kingdom.capital.name}</p>
                            </div>
                        `);
                        infoWindow.open(map, marker);
                        selectKingdom(kingdom.id);
                    });

                    markers.push(marker);
                }
            });

            // Pan and zoom to new period
            map.panTo(period.center);
            map.setZoom(period.zoom);

            // Update legend
            renderLegend();
        }

        // Render Legend
        function renderLegend() {
            const period = historicalData.periods[currentPeriodIndex];

            mapLegend.innerHTML = '';
            period.kingdoms.forEach(kingdom => {
                const item = document.createElement('div');
                item.className = 'legend-item' + (selectedKingdom === kingdom.id ? ' selected' : '');
                item.innerHTML = `
                    <div class="legend-color" style="background-color: ${kingdom.color}"></div>
                    <span class="legend-name">${kingdom.name} (${kingdom.chinese})</span>
                `;
                item.addEventListener('click', () => selectKingdom(kingdom.id));
                mapLegend.appendChild(item);
            });
        }

        // Select Kingdom
        function selectKingdom(kingdomId) {
            selectedKingdom = kingdomId;

            // Update polygon styles
            polygons.forEach(polygon => {
                if (polygon.kingdomId === kingdomId) {
                    polygon.setOptions({ fillOpacity: 0.7, strokeWeight: 5 });
                } else {
                    polygon.setOptions({ fillOpacity: 0.4, strokeWeight: 3 });
                }
            });

            // Update legend
            renderLegend();

            // Update info panel
            updateInfoPanel();
        }

        // Update Info Panel
        function updateInfoPanel() {
            const period = historicalData.periods[currentPeriodIndex];

            if (!selectedKingdom) {
                infoPanel.innerHTML = `
                    <div class="placeholder-message">
                        Click on a kingdom on the map to see detailed information
                    </div>
                `;
                return;
            }

            const kingdom = period.kingdoms.find(k => k.id === selectedKingdom);
            if (!kingdom) return;

            infoPanel.innerHTML = `
                <div class="info-header fade-in">
                    <div>
                        <div class="kingdom-name">${kingdom.name}</div>
                        <div class="kingdom-name-chinese">${kingdom.chinese}</div>
                    </div>
                    <div class="kingdom-duration">${period.years}</div>
                </div>

                <div class="info-content fade-in">
                    <div class="info-section">
                        <h3>Overview</h3>
                        <p class="description">${kingdom.description}</p>
                    </div>

                    <div class="info-section">
                        <h3>Key Events</h3>
                        <ul class="events-list">
                            ${kingdom.events.map(event => `
                                <li>
                                    <span class="event-year">${event.year}</span>
                                    ${event.text}
                                </li>
                            `).join('')}
                        </ul>
                    </div>

                    <div class="info-section">
                        <h3>Notable Figures</h3>
                        <ul class="characters-list">
                            ${kingdom.characters.map(char => `
                                <li>
                                    <div>
                                        <span class="character-name">${char.name}</span>
                                        <span class="character-title">${char.title}</span>
                                    </div>
                                    <div class="character-desc">${char.desc}</div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                </div>
            `;
        }

        // Event Listeners
        timelineSlider.addEventListener('input', (e) => {
            currentPeriodIndex = parseInt(e.target.value);
            updatePeriod();
        });

        // Initialize when API loads
        window.initMap = initMap;
    </script>

    <!-- Google Maps API -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBunqBMTUS4mACCzpkAokrbCs_O2H5896c&callback=initMap"></script>
</body>
</html>

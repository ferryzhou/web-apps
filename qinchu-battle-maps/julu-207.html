    <!-- 全图 · 诸侯救赵 -->
    <g id="phAll" class="ph">
      <circle class="siege" cx="640" cy="230" r="26"/>

    </g>

    <!-- 阶段一:斩宋义夺军 -->
    <g id="ph1" class="ph">
      <rect class="camp" x="376" y="532" width="9" height="9" transform="rotate(45 380 536)"/>
      <text class="mlabel j" x="300" y="522">宋义引兵至安阳,留四十六日不进</text>
      <text class="anno" x="300" y="558">欲坐观秦赵之敝,饮酒高会,士卒冻饥</text>
      <path class="march j" marker-end="url(#aj)" d="M 372,528 C 366,520 362,514 358,508"/>
      <text class="mlabel j" x="250" y="500">羽晨入斩宋义,号令军中</text>
      <text class="anno" x="250" y="486">怀王因以羽为上将军,诸军皆属焉</text>
    </g>

    <!-- 阶段二:破釜沉舟 -->

      <path class="march j" marker-end="url(#aj)" d="M 386,528 C 440,470 500,420 540,398"/>

      <path class="march j" marker-end="url(#aj)" d="M 552,394 C 574,360 588,330 604,308"/>
      <text class="mlabel j" x="470" y="420">绝章邯甬道</text>
      <path class="march j" marker-end="url(#aj)" d="M 598,342 C 616,316 626,290 636,258"/>
      <circle class="star" cx="620" cy="300" r="8"/>
      <text class="mlabel j" x="560" y="376">乃悉引兵渡漳,沉船破釜,持三日粮</text>
      <text class="anno" x="560" y="392">烧庐舍,以示士卒必死,无一还心</text>
      <text class="mlabel j" x="648" y="322">与秦军遇,九战,绝其甬道</text>

    <g id="ph3" class="ph">

      <text class="mlabel j" x="500" y="196">楚战士无不一当十,呼声动天</text>
      <path class="march q rout" marker-end="url(#ar)" d="M 646,254 C 640,268 632,282 620,296"/>
      <text class="mlabel r" x="660" y="252">虏王离,苏角死,涉间自烧</text>

      <text class="anno" x="700" y="200">诸侯将入辕门,皆膝行而前,莫敢仰视</text>

  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《史记·项羽本纪》《史记·张耳陈馀列传》《资治通鉴》卷八约略绘出。疆界、水道经简化,以点划「约界」示秦与赵·诸侯之势界,非实有画界。</p>
    <p><span class="n">注二</span>巨鹿在今河北平乡,漳水即今漳河,殷墟在今河南安阳,棘原、甬道故址在漳南。诸城邑方位以河北、河内地望约略定之。</p>
    <p><span class="n">注三</span>「破釜沉舟」「作壁上观」「膝行而前」皆本此役;项羽以此定亡秦首功、诸侯之霸。本图从项羽反秦之锋,楚·诸侯用青,秦军溃降用褐。</p>

<script>
const PH={
  all:{t:"诸侯救赵",d:"秦二世二年冬 — 三年",p:["秦将章邯既破项梁于定陶,以为楚地兵不足忧,乃北渡河击赵,与王离、涉间围赵王歇、张耳于巨鹿城中。章邯军其南棘原,筑甬道属河以饷王离,兵盛粮足。","赵数请救于楚。诸侯兵来救巨鹿者十余壁,皆莫敢纵兵,坚壁自守以观成败。楚怀王遣上将军宋义、次将项羽、末将范增将兵北救赵,天下存亡,系于河北一战。"]},
  "1":{t:"斩宋义夺军",d:"秦二世三年 十一月",p:["宋义引兵至安阳,留四十六日不进,曰:「今秦攻赵,战胜则兵罢,我承其敝;不胜则我引兵鼓行而西,必举秦矣。」欲坐观秦赵之敝。时天寒大雨,士卒冻饥,而宋义饮酒高会。","项羽晨朝上将军宋义,即其帐中斩之,出令军中曰:「宋义与齐谋反楚,楚王阴令羽诛之。」诸将慑服,莫敢枝梧。怀王因立羽为上将军,当阳君、蒲将军皆属项羽。"]},
  "2":{t:"破釜沉舟",d:"秦二世三年 十二月",p:["项羽乃遣当阳君英布、蒲将军将卒二万渡河,救巨鹿,战少利,绝章邯甬道。陈馀复请兵,项羽乃悉引兵渡漳水。","既渡,皆沉船,破釜甑,烧庐舍,持三日粮,以示士卒必死,无一还心。于是至则围王离,与秦军遇,九战,绝其甬道,大破之。"]},
  "3":{t:"巨鹿解围",d:"秦二世三年 十二月",p:["楚战士无不一以当十,呼声动天,诸侯军无不人人惴恐。遂虏王离,苏角死,涉间不降楚而自烧死;秦围巨鹿者尽破,巨鹿之围乃解。","于是已破秦军,项羽召见诸侯将,入辕门,无不膝行而前,莫敢仰视。项羽由是始为诸侯上将军,诸侯皆属焉。章邯军渐却,久之乃以殷墟、洹水降,秦之精锐尽丧于此役。"]}
};

const PH={
  all:{t:"出汉中·还定三秦",d:"汉元年　前206",p:["项羽既定天下,负约不王刘邦关中,徙之王汉中、巴、蜀,都南郑;而三分关中,以秦降将章邯为雍王、司马欣为塞王、董翳为翟王,列据渭上,以扼汉之东出,谓之「三秦」。","汉王用韩信之策,还定三秦:之国汉中,烧绝所过栈道以示无东还之心,以懈项羽之备;既拜韩信为大将,乃明作修复栈道之状以误敌,而潜出故道,直袭雍地。"]},
  "1":{t:"烧栈示弱",d:"汉元年四月　就国汉中",p:["汉王之国,道由褒斜。从张良计,所过栈道皆烧绝之,以示天下无东还之心,且备诸侯、盗兵之袭,而阴以懈项羽之东顾。项羽以故无西忧,乃北击齐。","汉王至南郑,士卒多道亡归者,萧何进韩信,汉王择良日,斋戒设坛场,拜信为大将。信为陈项羽之短、汉王之长,决策东乡,争权天下——三秦之谋,自此定矣。"]},
  "2":{t:"暗度陈仓",d:"汉元年八月　还袭雍",p:["八月,汉王引兵东出。乃明作修复栈道之状以误敌,佯攻褒斜,而潜出故道,自陈仓北出,直袭雍地。章邯不意汉之骤至,仓卒拒之陈仓,战败。","章邯走,汉军追之;邯止战好畤,又败,遂走废丘,婴城自守。塞、翟望风,关中震动。信之用兵,声东击西,一举而破雍之藩篱。"]},
  "3":{t:"定三秦",d:"汉元年至二年",p:["汉王围章邯于废丘,而分兵略地:别将定陇西、北地、上郡,尽取关中之旁郡。塞王司马欣、翟王董翳皆降,汉遂平三秦之二,而都栎阳。","废丘孤城久守,明年(汉二年)六月,汉引水灌之,城坏,章邯自杀,雍地悉定,三秦尽平。关中既为汉有,粮饷根本立焉,汉王乃东出函谷,与楚争天下。"]}
};
const CITY={
  nanzheng:{t:"南郑·汉中",d:"今陕西汉中",p:["项羽徙刘邦所都,汉之就国也。烧绝褒斜栈道以示弱,拜韩信为大将于此,决策东乡还定三秦。"]},
  chencang:{t:"陈仓·故道",d:"今陕西宝鸡",p:["韩信暗度之处。汉军潜出故道,自陈仓北出,章邯拒战而败——「暗度陈仓」之所本。"]},
  feiqiu:{t:"废丘",d:"今陕西兴平东南",p:["章邯雍都。兵败退守,婴城自固。汉围之,明年引水灌城,章邯自杀,三秦悉平。"]},
  haozhi:{t:"好畤",d:"今陕西乾县东",p:["章邯自陈仓败走,止战好畤,又为汉军所破,遂奔废丘婴城自守。"]},
  liyang:{t:"栎阳·咸阳",d:"今陕西西安阎良、西北",p:["咸阳为秦故都;栎阳形胜居东,汉略定关中后徙都于此,以为东出之基。"]},
  xianyang:{t:"咸阳",d:"秦故都,今西安西北",p:["渭上重地,秦之旧都。汉军东略,塞、翟既降,关中之地略入汉有。"]},
  longxi:{t:"陇西",d:"今甘肃临洮一带",p:["关中之西鄙。汉围废丘时,别遣将定陇西、北地、上郡,尽收三秦旁郡之地。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

      <text class="mlabel q" x="640" y="200">魏王豹塞临晋、绝河关以拒汉</text>
      <text class="anno" x="360" y="440">郦食其往说不听,遂决于兵</text>

      <text class="anno" x="470" y="418">以为汉军必由此渡,重设备焉</text>
      <text class="mlabel j" x="150" y="560">韩信军自荥阳、关中西来,临河而止</text>

      <text class="mlabel j" x="640" y="230">击破之,进虏魏豹于东垣</text>

      <text class="anno" x="150" y="536">因请益兵北举燕赵、东击齐,南绝楚粮道</text>

    <p><span class="n">注二</span>临晋关在今陕西大荔东,蒲坂在其对岸(今山西永济);夏阳在今陕西韩城南;安邑在今山西夏县;东垣在今山西垣曲一带。</p>

<script>
const PH={
  all:{t:"魏豹叛汉",d:"汉二年(前205)",p:["彭城之败后,诸侯多背汉附楚。魏王豹谒归视亲疾,即绝河关,反为楚,塞临晋、绝河津以拒汉。刘邦遣郦食其往说之,豹不听,曰「人生一世间,如白驹过隙耳」,汉王乃以韩信为左丞相,将兵击魏。","魏据河东,恃黄河之险为固;汉自关中、荥阳而来,隔河相望。信问郦生「魏得毋用周叔为大将乎」,闻其将柏直,曰「竖子耳」,遂进兵临河,谋所以渡。"]},
  "1":{t:"陈兵蒲坂",d:"汉二年·临河",p:["魏豹盛兵蒲坂,塞临晋关。临晋乃河东正渡,舟楫所会;豹以为汉军必由此渡,故重列兵备,壅塞津口,专候于此。","韩信军抵河西,临流而止。魏豹据险自恃,以为河防已固,不虞信之别有奇谋也。"]},
  "2":{t:"木罂渡军",d:"汉二年·奇渡",p:["韩信乃多陈船于临晋,若将济者,以疑魏兵——是为疑兵。魏豹果聚重于蒲坂,守望正渡。","而信潜以木罂缶载兵,自夏阳上游偷渡黄河。夏阳在临晋之北,魏备所不及。军既济,径袭安邑,出魏军不意,魏都仓卒而破。"]},
  "3":{t:"虏豹定魏",d:"汉二年·平河东",p:["魏豹闻安邑被袭,大惊,引兵还迎战。韩信击破之,乘胜进虏魏豹于东垣,械系传送荥阳,以献汉王。","于是尽定魏地,置河东、太原、上党三郡。信因请益兵三万,愿以北举燕、赵,东击齐,南绝楚之粮道,西与汉王会于荥阳——「北伐」之大略自此张焉。"]}
};
const CITY={
  pubanlinjinguan:{t:"蒲坂·临晋关",d:"今山西永济、陕西大荔东隔河相对",p:["河东正渡、津口所会。魏豹陈重兵塞此,以为汉军必由此渡;韩信乃陈船以疑之,而别渡于夏阳。"]},
  xiayang:{t:"夏阳",d:"今陕西韩城南",p:["临晋之北、黄河上游。魏备所不及。韩信潜以木罂缶载兵自此偷渡,径袭安邑,声东击西之枢也。"]},
  anyi:{t:"安邑",d:"魏都,今山西夏县",p:["魏豹之都。韩信渡河即径袭之,出魏军不意,都城仓卒而破,河东全局遂动。"]},
  dongyuan:{t:"东垣",d:"今山西垣曲一带",p:["魏豹引兵迎战被破后,韩信乘胜进虏魏豹于此,械系传送荥阳。"]},
  xingyang:{t:"荥阳",d:"汉之本营,今河南荥阳东北",p:["刘邦拒楚之根本。韩信传送魏豹至此;既定河东,信请益兵,期与汉王会师于荥阳。"]},
  huanghe:{t:"黄河",d:"魏汉之天堑",p:["魏据河东恃以为固,塞临晋、绝河关。韩信以疑兵临晋、奇兵夏阳,越此天堑而定魏。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

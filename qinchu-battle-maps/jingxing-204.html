const PH={
  all:{t:"下赵井陉",d:"汉三年(前204)·冬",p:["汉既定魏、代,韩信、张耳将兵数万,东下井陉以击赵。井陉者,太行之险道,车不得方轨,骑不得成列,行数百里,其势援兵必在后。","赵王歇、成安君陈馀闻汉且袭,聚兵井陉口,号称二十万,壁而守之,扼险以逸待劳。汉军远来,粮道悬绝,形势至危。"]},

  "2":{t:"背水列阵",d:"汉三年·平旦前后",p:["韩信闻陈馀不用广武君策,大喜,乃敢引兵遂下。未至井陉口三十里,止舍。夜半,遣轻骑二千,人持一赤帜,从间道萆山而望赵军,诫曰:赵见我走,必空壁逐我,若疾入赵壁,拔赵帜,立汉赤帜。","又先令万人出,背绵蔓水而陈。赵军望见而大笑,以为汉将不知兵法——背水者,无所退也。平旦,信建大将之旗鼓,鼓行出井陉口;赵开壁击之,大战良久。"]},

};
const CITY={
  jingxingkou:{t:"井陉口",d:"太行险道,今河北井陉",p:["太行八陉之一,山道险狭,车不得方轨、骑不得成列。陈馀壁其口,汉军自此鼓行而出,遂为决战之门户。"]},
  mianman:{t:"绵蔓水",d:"井陉口西,韩信背水陈处",p:["韩信先令万人背此水而陈,赵望见大笑。及战,汉军无所退,人自为战,卒以背水死战破赵——「背水一战」由此。"]},
  zhaobi:{t:"赵壁",d:"陈馀大营,井陉口外",p:["赵二十万之众所壁。赵空壁逐汉之利,汉奇兵二千乘虚驰入,拔赵旗、立汉赤帜二千,赵军还见而大惊乱走。"]},
  bishan:{t:"萆山",d:"汉奇兵二千伏处,近井陉",p:["韩信夜遣轻骑二千,人持一赤帜,从间道隐蔽于此以望赵军,伺赵空壁而袭其营——拔帜易帜之伏所。"]},
  zhishui:{t:"泜水",d:"陈馀败死处,井陉东南",p:["赵军乱走,汉夹击大破之。成安君陈馀被斩于此水之上,赵王歇被擒,赵地遂定。"]},
  xiangguo:{t:"襄国",d:"赵都,今河北邢台",p:["赵王歇之都。井陉一败,赵王被擒,河北传檄而定;韩信进而谋燕、齐,汉之势愈张。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

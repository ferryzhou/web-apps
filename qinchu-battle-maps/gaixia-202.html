<script>
const PH={
  all:{t:"合围垓下",d:"汉五年(前202)十二月",p:["鸿沟既约,中分天下,项羽引兵东归;刘邦用张良、陈平之谋,背约追楚。初追至固陵,韩信、彭越期而不至,汉军反为楚所败。","乃从张良计,裂地以王韩信、彭越,许以固陵以东尽与之。二人乃引兵毕会,刘贾、英布亦自南合,诸侯之兵大集,合围项羽于垓下——楚少汉众,如铁桶焉。"]},
  "1":{t:"固陵约诸侯",d:"汉五年十月 — 十二月",p:["刘邦追项羽至固陵,约韩信、彭越共击楚。二人不至,楚击汉军,大破之;汉王复入壁,深堑而自守。","张良曰:「君王能与共分天下,今可立致也。」乃裂睢阳以北至穀城予彭越,陈以东傅海予韩信。使者至,二人报曰「请今进兵」;韩信自齐、彭越自梁、刘贾英布自南,四面而合,楚军遂被大围于垓下。"]},
  "2":{t:"四面楚歌",d:"汉五年十二月 夜",p:["项羽壁垓下,兵少食尽;汉与诸侯兵围之数重。夜闻汉军四面皆楚歌,项王乃大惊曰:「汉皆已得楚乎?是何楚人之多也!」","项王则夜起,饮帐中。有美人名虞,常幸从;骏马名骓,常骑之。于是慷慨悲歌,自为诗曰「力拔山兮气盖世,时不利兮骓不逝」。歌数阕,美人和之;项王泣数行下,左右皆泣,莫能仰视。乃夜率壮士八百余骑,溃围南出,驰走。"]},

const CITY={
  gaixia:{t:"垓下",d:"今安徽灵璧南",p:["项羽壁此,兵少食尽,汉与诸侯围之数重。夜闻四面楚歌,悲歌别姬,乃溃围南出——「霸王别姬」之地。"]},
  guling:{t:"固陵·陈下",d:"今河南太康南",p:["刘邦背约追楚,先败于此;韩信、彭越期而不至,汉军深堑自守。用张良计裂地王二人,乃转败为围。"]},
  yinling:{t:"阴陵",d:"今安徽定远西北",p:["项羽渡淮后至此迷失道,问田父,田父绐以「左」,遂陷大泽,以故汉追及之。"]},
  dongcheng:{t:"东城",d:"今安徽定远东南",p:["项羽突围至此,乃有二十八骑。自度不得脱,溃围斩将刈旗,以示「天亡我,非战之罪」。"]},
  wujiang:{t:"乌江",d:"今安徽和县东北,长江北岸",p:["项羽自刎之地。亭长舣船请渡,羽笑「天之亡我,我何渡为」、「无面目见江东父老」,乃下马步战,身被十余创,自刎而死。"]},
  pengcheng:{t:"彭城",d:"西楚都,今江苏徐州",p:["项羽自立西楚霸王,都彭城。垓下既败,楚地悉定;鲁最后为项王守节,闻其头乃降。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>

<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鄢陵之战 · 周简王十一年(前575)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--paper:#e9dec4;--paper2:#e0d3b3;--ink:#2b2418;--ink2:#5c4f38;--faint:#8a7c5e;--advance:#1f4e54;--advance2:#2c6b6f;--enemy:#9a2b1e;--ret:#7a5a23;--water:#5f7f88;--gold:#9c7a2c;--border:#6e5d3c;--seal:#9a2b1e;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:radial-gradient(circle at 20% 10%, #4a4334 0%, #322c20 55%, #221d14 100%);min-height:100vh;font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:clamp(10px,3vw,40px);}
  .frame{max-width:880px;margin:0 auto;background:linear-gradient(160deg, rgba(255,250,235,.55), rgba(0,0,0,0) 40%),radial-gradient(ellipse at 70% 20%, rgba(120,95,50,.10), rgba(0,0,0,0) 60%),radial-gradient(ellipse at 15% 85%, rgba(90,70,40,.14), rgba(0,0,0,0) 55%),var(--paper);border:3px double var(--border);outline:1px solid rgba(0,0,0,.35);box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 0 80px rgba(110,90,55,.25);padding:clamp(16px,3vw,34px);position:relative;}
  .seal{position:absolute;top:clamp(14px,3vw,30px);right:clamp(14px,3vw,30px);width:62px;height:62px;border:2.5px solid var(--seal);border-radius:4px;transform:rotate(-5deg);opacity:.9;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;color:var(--seal);font-family:"Ma Shan Zheng",serif;box-shadow:inset 0 0 0 1px rgba(154,43,30,.35);}
  .seal span{display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1}
  header{margin-bottom:14px;padding-right:74px}
  h1{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:clamp(30px,5.4vw,46px);letter-spacing:.05em;color:var(--ink);}
  .sub{margin-top:4px;font-size:clamp(12px,1.7vw,14px);color:var(--ink2);letter-spacing:.1em}
  .sub b{color:var(--enemy);font-weight:700}.sub i{color:var(--advance);font-style:normal;font-weight:700}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 14px}
  .tabs button{appearance:none;cursor:pointer;font-family:inherit;background:rgba(255,250,235,.4);color:var(--ink2);border:1px solid var(--border);border-radius:2px;padding:7px 13px;font-size:13.5px;letter-spacing:.06em;transition:all .2s;}
  .tabs button:hover{background:rgba(255,250,235,.75)}
  .tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .mapwrap{border:1px solid var(--border);background:var(--paper2);position:relative}
  svg.map{display:block;width:100%;height:auto}
  .river{fill:none;stroke:var(--water);stroke-linecap:round;opacity:.85}
  .rname{fill:var(--water);font-size:12.5px;letter-spacing:.22em;font-weight:500;opacity:.95}
  .border{fill:none;stroke:var(--ink2);stroke-width:1.6;stroke-dasharray:1 5 7 5;opacity:.7;stroke-linecap:round}
  .realm{font-family:"Ma Shan Zheng",serif;letter-spacing:.28em}
  .realm.q{fill:var(--enemy);opacity:.42}.realm.j{fill:var(--advance);opacity:.42}
  .mtn{fill:none;stroke:var(--ink2);stroke-width:1.2;opacity:.85}
  .city{cursor:pointer}
  .city circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;transition:all .15s}
  .city.cap circle{stroke-width:2}
  .city:hover circle,.city.sel circle{fill:var(--gold);stroke:var(--ink)}
  .cname{font-size:13px;font-weight:700;fill:var(--ink);pointer-events:none}
  .cname.s{font-size:11.5px;font-weight:400;fill:var(--ink2)}
  .march{fill:none;stroke-width:3;stroke-linecap:round}
  .march.j{stroke:var(--advance)}.march.q{stroke:var(--enemy)}
  .march.rout{stroke:var(--ret);stroke-width:2.6;stroke-dasharray:3 7}
  .mlabel{font-size:11.5px;font-weight:700}
  .mlabel.j{fill:var(--advance)}.mlabel.q{fill:var(--enemy)}.mlabel.r{fill:var(--ret)}
  .anno{font-size:11px;fill:var(--ink2);font-style:italic}
  .camp{fill:var(--enemy);opacity:.9}
  .star{fill:none;stroke:var(--gold);stroke-width:2}
  .siege{fill:none;stroke:var(--enemy);stroke-width:1.6;stroke-dasharray:2 4}
  .compass{opacity:.65}.compass text{fill:var(--ink2);font-size:11px;font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 2px 0;font-size:12.5px;color:var(--ink2)}
  .legend .item{display:inline-flex;align-items:center;gap:6px}.legend svg{display:block}
  .panel{margin-top:14px;border:1px solid var(--border);background:rgba(255,250,235,.5);padding:14px 16px;min-height:96px;}
  .panel h2{font-size:17px;font-weight:700;letter-spacing:.08em;margin-bottom:3px}
  .panel .date{font-size:11.5px;color:var(--gold);letter-spacing:.16em;margin-bottom:8px}
  .panel p{font-size:13.5px;line-height:1.9;text-align:justify}.panel p+p{margin-top:7px}
  .notes{margin-top:14px;border-top:1px solid rgba(110,93,60,.4);padding-top:10px}
  .notes p{font-size:11.5px;line-height:1.75;color:var(--faint);text-align:justify}.notes p+p{margin-top:4px}
  .notes .n{color:var(--enemy);font-weight:700;margin-right:4px}
  .ph{opacity:0;visibility:hidden;transition:opacity .4s}
  body[data-ph="all"] #phAll,body[data-ph="1"] #ph1,body[data-ph="2"] #ph2,body[data-ph="3"] #ph3{opacity:1;visibility:visible}
  .ph.show .march:not(.rout){stroke-dasharray:660;stroke-dashoffset:660;animation:draw 1.5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){.ph.show .march{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
  .navback{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:2px;padding:5px 12px;margin-bottom:14px;background:rgba(255,250,235,.42);letter-spacing:.06em;transition:all .16s;max-width:max-content}
  .navback:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .navback:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body data-ph="all">
<div class="frame">
  <a class="navback" href="../chunqiu-battle-maps/index.html" aria-label="返回春秋战国征战图录总目">↩ 战图总目</a>
  <div class="seal" aria-hidden="true"><span>鄢</span><span>陵</span><span>之</span><span>役</span></div>
  <header>
    <h1>鄢陵之战</h1>
    <div class="sub">周简王十一年(前575)　　<i>晋 厉公 · 郤至</i> 大败楚郑 · <b>楚 共王</b>中目宵遁</div>
  </header>
  <div class="tabs" role="tablist">
    <button class="on" data-p="all">全图 · 楚郑伐郑 · 晋救</button>
    <button data-p="1">逼营列阵 · 填井夷灶</button>
    <button data-p="2">郤至察弊 · 魏锜射王目</button>
    <button data-p="3">楚宵遁 · 子反自杀</button>
  </div>
  <div class="mapwrap">
  <svg class="map" viewBox="0 0 1000 640" role="img" aria-label="鄢陵之战形势图,含晋楚疆界、颍水与鄢陵新郑晋绛楚郢等城邑">
    <defs>
      <pattern id="qinHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="rgba(154,43,30,.07)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(154,43,30,.30)" stroke-width="1"/></pattern>
      <pattern id="jinHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="9" height="9" fill="rgba(31,78,84,.07)"/><line x1="0" y1="0" x2="0" y2="9" stroke="rgba(31,78,84,.30)" stroke-width="1"/></pattern>
      <marker id="aq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a2b1e"/></marker>
      <marker id="aj" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e54"/></marker>
      <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a5a23"/></marker>
    </defs>

    <!-- 疆界:晋据河北(北),楚据江汉(南),郑在其间;约以颍水一线为界示意 -->
    <path d="M 0,392 C 160,378 320,404 470,398 C 620,392 780,414 1000,404 L 1000,640 L 0,640 Z" fill="url(#qinHatch)"/>
    <path d="M 0,392 C 160,378 320,404 470,398 C 620,392 780,414 1000,404 L 1000,0 L 0,0 Z" fill="url(#jinHatch)"/>
    <path class="border" d="M 0,392 C 160,378 320,404 470,398 C 620,392 780,414 1000,404"/>
    <text class="realm j" x="120" y="90" font-size="32">晋(北)</text>
    <text class="realm q" x="720" y="590" font-size="32">楚(南)</text>

    <!-- 颍水:自西北向东南流过郑地(鄢陵所在) -->
    <path class="river" stroke-width="4.5" d="M 300,300 C 380,340 460,372 540,398 C 620,424 700,452 790,486"/>
    <text class="rname" x="640" y="450" transform="rotate(20 640 450)">颍 水</text>

    <!-- 城邑 -->
    <g id="cities">
      <g class="city" data-city="yanling"><circle cx="500" cy="356" r="6"/><text class="cname" x="470" y="342">鄢陵<tspan class="cname s" dx="2">(郑地·决战)</tspan></text></g>
      <g class="city cap" data-city="xinzheng"><circle cx="676" cy="316" r="5.5"/><text class="cname" x="688" y="312">新郑<tspan class="cname s" dx="2">(郑都)</tspan></text></g>
      <g class="city cap" data-city="jinjiang"><circle cx="300" cy="120" r="6"/><text class="cname" x="312" y="116">晋绛<tspan class="cname s" dx="2">(晋都)</tspan></text></g>
      <g class="city cap" data-city="ying"><circle cx="700" cy="560" r="6"/><text class="cname" x="712" y="556">楚郢<tspan class="cname s" dx="2">(楚都)</tspan></text></g>
      <g class="city" data-city="yingshui"><circle cx="540" cy="398" r="3.5"/><text class="cname s" x="452" y="416">颍水(界水)</text></g>
      <g class="city" data-city="pengzu"><circle cx="420" cy="176" r="4"/><text class="cname s" x="428" y="172">彭祖(晋军所出)</text></g>
    </g>

    <!-- 全图 · 楚郑伐郑 · 晋救 -->
    <g id="phAll" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 306,132 C 360,180 420,250 490,344"/>
      <text class="mlabel j" x="330" y="236">晋厉公亲率师伐郑</text>
      <text class="anno" x="336" y="256">栾书、郤至、士燮从</text>
      <path class="march q" marker-end="url(#aq)" d="M 694,548 C 640,470 560,410 512,368"/>
      <text class="mlabel q" x="560" y="480">楚共王救郑,子反将中军</text>
      <path class="march q" marker-end="url(#aq)" d="M 668,322 C 600,338 550,348 514,354"/>
      <text class="mlabel q" x="560" y="330">郑成公叛晋从楚,合师</text>
      <text class="anno" x="416" y="380">两军遇于鄢陵</text>
    </g>

    <!-- 阶段一:逼营列阵 · 填井夷灶 -->
    <g id="ph1" class="ph">
      <rect class="camp" x="524" y="372" width="10" height="10" transform="rotate(45 529 377)"/>
      <text class="mlabel q" x="540" y="392">楚乘晋未阵 · 迫营而陈</text>
      <path class="march q" marker-end="url(#aq)" d="M 540,378 C 528,372 518,366 510,362"/>
      <text class="mlabel j" x="360" y="330">晋填井平灶,营中就地布阵以应</text>
      <text class="anno" x="380" y="348">士燮欲避,栾书、郤至主战</text>
    </g>

    <!-- 阶段二:郤至察弊 · 魏锜射王目 -->
    <g id="ph2" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 496,350 C 508,352 520,356 528,362"/>
      <circle class="star" cx="512" cy="360" r="8"/>
      <text class="mlabel j" x="360" y="320">郤至相楚军,知其陈旧卒嚣可胜</text>
      <text class="mlabel j" x="360" y="338">魏锜(吕锜)射中楚共王之目</text>
      <text class="anno" x="380" y="356">晋厉公陷淖;郤至三遇王必下车免胄</text>
    </g>

    <!-- 阶段三:楚宵遁 · 子反自杀 -->
    <g id="ph3" class="ph">
      <path class="march rout" marker-end="url(#ar)" d="M 512,366 C 580,430 640,490 692,548"/>
      <text class="mlabel r" x="560" y="470">楚师夜遁,归楚</text>
      <text class="anno" x="428" y="382">战竟日未决;子反醉不能军</text>
      <text class="mlabel r" x="640" y="540">子反归而自杀</text>
      <text class="anno" x="330" y="256">晋复申其霸</text>
    </g>

    <g class="compass" transform="translate(944,560)">
      <circle r="20" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <path d="M 0,-20 L 4,0 L 0,16 L -4,0 Z" fill="var(--ink2)"/>
      <path d="M 0,20 L 4,0 L -4,0 Z" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <text x="-4" y="-24">北</text>
    </g>
  </svg>
  </div>
  <div class="legend">
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#1f4e54" stroke-width="3"/></svg>晋军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#9a2b1e" stroke-width="3"/></svg>楚·郑军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>宵遁</span>
    <span class="item"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#9c7a2c" stroke-width="2"/></svg>决战</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#jinHatch)"/></svg>晋</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#qinHatch)"/></svg>楚</span>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《左传·成公十六年》《史记·晋世家》约略绘出。鄢陵在今河南鄢陵西北,晋绛在今山西侯马,新郑在今河南新郑,楚郢在今湖北荆州北。城邑水道为相对示意,非按实测。</p>
  </div>
</div>
<script>
const PH={
  all:{t:"楚郑伐郑 · 晋救",d:"周简王十一年(前575) · 春",p:["郑背晋盟,叛而从楚,晋不能堪。晋厉公亲将三军以伐郑,栾书佐中军,郤至、士燮、韩厥等从。","楚共王闻郑急,发师救之,子反将中军以进;郑成公亦合师相待。两军遂遇于鄢陵之野,晋楚复较霸权于一战。"]},
  "1":{t:"逼营列阵 · 填井夷灶",d:"六月甲午晦",p:["楚人乘晋军未及成列,迫其营垒而陈,欲以势逼之。晋营地隘,不得展布。","晋人乃填井、平灶,即营中就地为阵以应楚。士燮以为宜避楚锋、待其自敝;栾书、郤至则以为可战,请与楚决。"]},
  "2":{t:"郤至察弊 · 魏锜射王目",d:"六月甲午晦 · 昼",p:["郤至相楚之陈,曰「楚有六间,不可失也」:楚军陈旧、卒嚣、行乱,中军与左右不相为用,王卒又杂而不整,故断其可胜。","晋军奋击。晋将魏锜(吕锜)引弓射中楚共王之目,楚师大挫。厉公尝陷于泥淖,郤至三遇楚共王,必下车免胄而趋,以致其礼。"]},
  "3":{t:"楚宵遁 · 子反自杀",d:"六月甲午晦 · 夜",p:["战至日暮而胜负未分。共王中目,召子反谋复战,子反夜饮而醉,不能受命应对。","楚师无所倚,遂乘夜宵遁而归。子反既归,以丧师之罪自杀。晋于是复申其霸,威震诸侯。"]}
};
const CITY={
  yanling:{t:"鄢陵",d:"郑地,今河南鄢陵西北",p:["晋楚决战之所。两军遇于此野,楚逼营而陈,晋填井夷灶以应,终一战而定霸。"]},
  xinzheng:{t:"新郑",d:"郑都,今河南新郑",p:["郑背晋从楚,为楚之与国。晋伐郑而楚救之,遂启鄢陵之役。"]},
  jinjiang:{t:"晋绛",d:"晋都,今山西侯马",p:["晋厉公自此亲率三军南下伐郑。战胜之后,晋复申其霸业。"]},
  ying:{t:"楚郢",d:"楚都,今湖北荆州北",p:["楚共王闻郑急,自郢发师北救。中目宵遁,归而子反自杀。"]},
  yingshui:{t:"颍水",d:"郑地界水",p:["流经鄢陵之野的水道,楚军自南渡而北向,与晋相持于其间。"]},
  pengzu:{t:"彭祖",d:"晋军所出 · 救郑之路",p:["晋师南下伐郑、趋鄢陵所经之地,当郑之北境,为晋军进止之途。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>
</html>

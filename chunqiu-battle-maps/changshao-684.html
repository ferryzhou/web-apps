<style>

  *{box-sizing:border-box;margin:0;padding:0;}

  .sub{margin-top:4px;font-size:clamp(12px,1.7vw,14px);color:var(--ink2);letter-spacing:.1em}

  .panel{margin-top:14px;border:1px solid var(--border);background:rgba(255,250,235,.5);padding:14px 16px;min-height:96px;}

  @media (prefers-reduced-motion:reduce){.ph.show .march{animation:none;stroke-dasharray:none;stroke-dashoffset:0}}
  .navback{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:2px;padding:5px 12px;margin-bottom:14px;background:rgba(255,250,235,.42);letter-spacing:.06em;transition:all .16s;max-width:max-content}
  .navback:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}

    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>齐师败退</span>

    <p><span class="n">注一</span>本图为示意图,依《左传·庄公十年》《史记·鲁周公世家》约略绘出。长勺在今山东莱芜(一说曲阜北),城邑水道为相对示意,非精确坐标。</p>
    <p><span class="n">注二</span>晕染疆界为齐鲁形势示意:齐居北东、鲁居南西,约以汶水为间;点划「约界」非实有画界。曹刿论战之语,并录《左传》原文,以见「一鼓作气」「彼竭我盈」「辙乱旗靡」之所本。</p>

<script>
const PH={
  all:{t:"齐师压境",d:"鲁庄公十年(前684)春",p:["齐桓公新即位,以鲁尝助公子纠与己争位,衔怨兴师伐鲁。前此鲁师已败于乾时,气势颇沮;今齐复大举压境,鲁人震恐。","鲁庄公将战,曹刿请见。其乡人曰「肉食者谋之,又何间焉」,刿曰「肉食者鄙,未能远谋」,遂入见。问何以战,公历数衣食之惠、牺牲之信,刿皆以为未孚;及公言「小大之狱,必以情」,刿曰「忠之属也,可以一战」,乃从公御齐师于长勺。"]},
  "1":{t:"齐三鼓 · 鲁按兵",d:"战于长勺 · 相持",p:["两军既陈于长勺,齐恃强而求速战。齐人先鼓进兵,公将鼓以应之,曹刿止之曰「未可」。","齐再鼓、三鼓,连番挑战,声势愈盛;而鲁军坚阵不动,凝然养锐,任齐三鼓求战而按兵不出。刿之意,正欲俟齐锐气三竭而后发。"]},
  "2":{t:"彼竭我盈 · 一鼓破齐",d:"战于长勺 · 决胜",p:["齐三鼓既毕,士气已衰。曹刿曰「可矣」,鲁始一鼓而进——彼竭我盈,士气如虹,一举大破齐师。","既克,公问其故。刿对曰「夫战,勇气也。一鼓作气,再而衰,三而竭。彼竭我盈,故克之」。以逸待劳、后发制人之理,尽在于此。"]},
  "3":{t:"察辙望旗 · 纵兵逐北",d:"战于长勺 · 逐北",p:["齐师既败,公将驰车逐之,刿又止曰「未可」。乃下车视其车辙,登轼而望其旌旗,曰「辙乱旗靡」,知非伪遁,乃曰「可矣」,遂纵兵追逐。","刿释其所以持重:「夫大国难测,惧有伏焉。吾视其辙乱,望其旗靡,故逐之。」鲁遂逐齐师出境。长勺一役,以弱鲁却强齐,后世传为以逸待劳、后发制人之典。"]}
};
const CITY={
  changshao:{t:"长勺",d:"鲁地,今山东莱芜(一说曲阜北)",p:["齐鲁决战之处。齐三鼓而气竭,鲁一鼓而气盈,曹刿谏庄公后发制人,大败齐师于此。"]},
  qufu:{t:"曲阜",d:"鲁国都城",p:["鲁庄公自此率师北御齐军。曹刿请见庄公,论「小大之狱,必以情」为可战之本,乃从战长勺。"]},
  linzi:{t:"临淄",d:"齐国都城",p:["齐桓公自此兴师伐鲁。公新即位,以鲁尝助公子纠争位,衔怨来伐,不意反败于长勺。"]},
  wenshui:{t:"汶水",d:"齐鲁之间界河",p:["汶水横亘齐鲁之间,大致为两国之界。齐师南越其地而压鲁境,鲁御之于长勺。"]},
  qianshi:{t:"乾时",d:"齐地,前役齐胜鲁处",p:["长勺之战前,鲁师已尝败于乾时,鲁气颇沮。故长勺之捷,尤见曹刿持重待时之效。"]},
  suiyi:{t:"遂邑",d:"近鲁小国,齐所灭",p:["遂为鲁之附庸小邦,近鲁而当齐冲。齐桓公伐鲁之际,并灭遂以张其势,鲁益迫矣。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

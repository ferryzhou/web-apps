    <p><span class="n">注一</span>本图为示意图,依《三国志·武帝纪》《张辽传》《郭嘉传》《田畴传》约略绘出。疆界、水道经简化;塞外辽西乌桓与曹操幽州之界以点划"约界"标之,非实有画界。</p>
    <p><span class="n">注二</span>白狼山在今辽宁喀左,柳城在今辽宁朝阳。卢龙塞为出塞险道,今喜峰口一带;濡水即今滦河,易水在今河北易县。</p>
    <p><span class="n">注三</span>堑山堙谷、轻兵远袭,乃奇险之胜。操归途艰苦,几乏水粮,凿地三十余丈方得水;既还,乃厚赏前谏止征者,曰"孤前行乘危以徼幸,虽得之,天所佐也"。</p>

<script>
const PH={
  all:{t:"北征乌桓",d:"汉建安十二年(207)",p:["官渡既败,袁尚、袁熙北奔辽西乌桓,依大人蹋顿。蹋顿骁武,数入塞为寇,杀略吏民,幽、冀不宁。曹操欲北征以绝后患,诸将多虑刘表袭许,独郭嘉料表必不能用刘备,劝操兼弱攻昧,轻兵远袭,直捣柳城。","操自蓟北进,以右北平田畴为乡导。时方夏秋,霖雨积潦,滨海道不通,乃回军别取间道,凿险傍绝,出敌不意——一举而虏其王庭。"]},
  "1":{t:"卢龙间道",d:"建安十二年 秋七月",p:["滨海道潦水弥漫,车骑不通,操几欲还师。田畴进言:旧北平郡治在平冈,道出卢龙,达于柳城;自建武以来陷坏断绝二百载,然有微径可寻。","操乃令堑山堙谷五百里,自无终出卢龙塞,傍白檀、历平冈,凿险傍绝而进。堑山填谷,昼夜兼行,虏不虞王师之至,竟未设备。"]},
  "2":{t:"白狼遇敌",d:"建安十二年 八月",p:["军次白狼山,去柳城二百余里,卒与蹋顿及袁尚、袁熙数万骑相遇。操军轻装疾进,辎重在后,被甲者少,左右皆惧。","操登高望之,见虏众虽盛而阵势不整,乃知可击。众心方摇,操意已决——纵兵急击,不容其成列。"]},
  "3":{t:"张辽斩蹋顿",d:"建安十二年 八月",p:["操假张辽以己之麾旌,辽劝乘其未整急击,气甚奋厉。张辽为前锋先登陷阵,大破之,阵斩蹋顿及名王以下,胡、汉降者二十余万口。","袁尚、袁熙率数千骑走辽东,依公孙康。康素惮袁氏,又幸操不来,乃斩尚、熙,函其首送于操。北边遂定,三郡乌桓由是衰息。"]}
};
const CITY={

  wuzhong:{t:"无终",d:"今天津蓟州",p:["滨海道潦不通,操驻此进退维谷;田畴议轻兵出卢龙间道,遂由此弃大道而入险。"]},
  lulong:{t:"卢龙塞",d:"今河北喜峰口一带",p:["燕山出塞险道,汉末陷坏断绝二百载。操堑山堙谷五百里,傍白檀、历平冈,凿险而出。"]},
  bailang:{t:"白狼山",d:"今辽宁喀左",p:["决战之地。操军卒与蹋顿数万骑遇,登高见虏阵不整,纵兵急击;张辽先登陷阵,阵斩蹋顿。"]},
  liucheng:{t:"柳城",d:"乌桓王庭,今辽宁朝阳",p:["三郡乌桓蹋顿之王庭,袁尚、袁熙所依。操北征之所指;白狼既破,王庭遂溃。"]},
  liaodong:{t:"辽东",d:"公孙康所据,今辽宁辽阳",p:["蹋顿败死,袁尚、袁熙北奔于此。公孙康斩之,函首送操,不劳而定辽东。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

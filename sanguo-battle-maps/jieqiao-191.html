<style>

  .navback{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);text-decoration:none;border:1px solid var(--border);border-radius:2px;padding:5px 12px;margin-bottom:14px;background:rgba(255,250,235,.42);letter-spacing:.06em;transition:all .16s;max-width:max-content}

<body data-ph="all">

  <header>
    <h1>界桥之战</h1>
    <div class="sub">汉初平二年(191)　　<i>袁绍</i> 破 <b>公孙瓒</b></div>
  </header>

    <defs>

    <path d="M 0,300 C 150,286 320,278 470,272 C 640,266 820,270 1000,258 L 1000,0 L 0,0 Z" fill="url(#qinHatch)"/>
    <path d="M 0,300 C 150,286 320,278 470,272 C 640,266 820,270 1000,258 L 1000,640 L 0,640 Z" fill="url(#jinHatch)"/>
    <path class="border" d="M 0,300 C 150,286 320,278 470,272 C 640,266 820,270 1000,258"/>

    <text class="realm j" x="620" y="560" font-size="32">袁 绍(冀州)</text>

    <path class="river" stroke-width="5.5" d="M 40,596 C 200,584 360,570 520,560 C 680,550 840,548 1000,536"/>

    <text class="rname" x="300" y="500" transform="rotate(-18 300 500)" style="font-size:10.5px">漳 水</text>

    <!-- 城邑 -->
    <g id="cities">

      <g class="city" data-city="pingyuan"><circle cx="760" cy="360" r="5"/><text class="cname" x="772" y="356">平原<tspan class="cname s" dx="2">(瓒南据)</tspan></text></g>
      <g class="city cap" data-city="jieqiao"><circle cx="470" cy="380" r="6"/><text class="cname" x="482" y="376">界桥<tspan class="cname s" dx="2">(决战地)</tspan></text></g>
      <g class="city" data-city="qinghe"><circle cx="600" cy="352" r="4"/><text class="cname s" x="612" y="348">清河(县)</text></g>
      <g class="city" data-city="longcou"><circle cx="700" cy="336" r="4"/><text class="cname s" x="712" y="332">龙凑(瓒再败处)</text></g>
      <g class="city cap" data-city="ye"><circle cx="300" cy="490" r="6"/><text class="cname" x="230" y="486">邺<tspan class="cname s" dx="2">(袁绍治)</tspan></text></g>
    </g>

    <!-- 全图 · 瓒袭冀州 -->
    <g id="phAll" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 640,132 C 660,220 700,300 730,352"/>
      <text class="mlabel q" x="668" y="230">公孙瓒破青、徐黄巾,威震河朔</text>
      <text class="anno" x="690" y="378">南据冀州诸城,自置州郡守令</text>
      <path class="march j" marker-end="url(#aj)" d="M 310,478 C 360,440 420,406 456,388"/>
      <text class="mlabel j" x="316" y="452">袁绍拒之于界桥(清河之上)</text>
      <text class="anno" x="380" y="512">河北二雄,一决于此</text>
    </g>

    <!-- 阶段一:白马压境 -->
    <g id="ph1" class="ph">
      <path class="march q" marker-end="url(#aq)" d="M 640,132 C 620,220 560,300 496,368"/>
      <text class="mlabel q" x="548" y="248">瓒自幽州南下,步骑三万列阵</text>
      <rect class="camp" x="716" y="332" width="9" height="9" transform="rotate(45 720 336)"/>
      <text class="anno" x="640" y="316">中军步卒,两翼各五千骑</text>
      <text class="mlabel q" x="520" y="352">"白马义从"为锋,声势甚盛</text>
      <text class="anno" x="560" y="404">冀州诸城多叛应之</text>
    </g>

    <!-- 阶段二:麹义先登 -->
    <g id="ph2" class="ph">
      <text class="mlabel q" x="510" y="330">瓒骑迫近数十步</text>
      <path class="march q" marker-end="url(#aq)" d="M 560,352 C 540,362 520,372 494,382"/>
      <path class="march j" marker-end="url(#aj)" d="M 448,384 C 460,382 470,382 480,382"/>
      <circle class="star" cx="470" cy="380" r="8"/>
      <text class="mlabel j" x="300" y="356">麹义领精兵八百、强弩千张为先登</text>
      <text class="anno" x="300" y="374">伏大楯下不动,俟其近乃腾跃</text>
      <text class="mlabel j" x="300" y="420">千弩俱发,白马义从披靡,斩严纲</text>
      <text class="anno" x="360" y="438">直取界桥</text>
    </g>

    <!-- 阶段三:追奔龙凑 -->
    <g id="ph3" class="ph">
      <path d="M 470,380 l 5,-11 l 4,8 l 9,-5 l -5,9 l 11,4 l -11,4 l 5,9 l -9,-5 l -4,8 l -5,-11 l -9,5 l 5,-9 l -11,-4 l 11,-4 l -5,-9 z" fill="#1f4e54" stroke="#e9dec4" stroke-width=".8"/>
      <path class="march j" marker-end="url(#aj)" d="M 486,378 C 550,364 620,350 686,340"/>
      <text class="mlabel j" x="500" y="330">麹义追拔其营、拔其牙门</text>
      <path class="march rout" marker-end="url(#ar)" d="M 712,332 C 700,270 680,200 648,136"/>
      <text class="mlabel r" x="704" y="240">瓒军大溃,退守幽州</text>
      <text class="anno" x="620" y="300">龙凑再战,瓒复败</text>
      <text class="anno" x="320" y="420">绍几为瓒骑所围,赖强弩得脱;河北归绍</text>
    </g>

    <g class="compass" transform="translate(944,560)">
      <circle r="20" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <path d="M 0,-20 L 4,0 L 0,16 L -4,0 Z" fill="var(--ink2)"/>
      <path d="M 0,20 L 4,0 L -4,0 Z" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <text x="-4" y="-24">北</text>
    </g>
  </svg>
  </div>
  <div class="legend">
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#1f4e54" stroke-width="3"/></svg>袁绍军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#9a2b1e" stroke-width="3"/></svg>公孙瓒军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>败退</span>
    <span class="item"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#9c7a2c" stroke-width="2"/></svg>决战</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#qinHatch)"/></svg>公孙瓒</span>
    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#jinHatch)"/></svg>袁绍</span>
  </div>
  <div class="panel" id="panel" aria-live="polite"></div>
  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《三国志·袁绍传》《公孙瓒传》《后汉书》及《资治通鉴》卷六十约略绘出。蓟、平原、界桥、龙凑、邺诸地相对方位从史,疆界、水道(黄河、清河、漳水)经简化,非实有画界。</p>
    <p><span class="n">注二</span>界桥在今河北威县东,以跨清河之桥得名;时为袁绍拒公孙瓒之要冲。</p>
    <p><span class="n">注三</span>麹义以八百强弩先登破"白马义从",为汉末以步破骑之名例。伏楯不动、俟近齐发,尽显弩阵之利。公孙瓒自此渐衰,终困于易京。</p>

<script>
const PH={
  all:{t:"瓒袭冀州",d:"汉初平二年(191)",p:["公孙瓒破青、徐黄巾,威震河朔,乘胜南据冀州诸城,自置州郡守令,气吞河北。袁绍新得冀州,兵势未固,乃拒瓒于界桥——桥跨清河之上,当南北之冲。","河北二雄相持,一战而定归属。此役之前,冀州诸城多观望叛附;界桥一决,遂判其势。"]},
  "1":{t:"白马压境",d:"初平二年·会战之初",p:["公孙瓒自幽州南下,以步骑三万列阵而进:中军尽为步卒,两翼各置骑兵五千,而以“白马义从”为前锋。瓒善用白马,选精骑数千,皆乘白马,号“白马义从”,纵横塞下,声势甚盛。","瓒军既盛,冀州诸城多叛而应之,袁绍之势危蹙。绍列阵于界桥之南以待,兵力寡于瓒,而阵法精严。"]},
  "2":{t:"麹义先登",d:"初平二年·决战",p:["袁绍以麹义领精兵八百、强弩千张为先登,余众继后。麹义久在凉州,晓习羌斗,乃令士卒伏于大楯之下,偃旗按兵不动,俟瓒骑迫近数十步。","瓒见其寡,纵骑直冲。麹义军一时腾跃而起,扬尘大叫,千弩俱发,应弦而倒者甚众。白马义从大乱披靡,斩瓒所置冀州刺史严纲,追奔直取界桥,瓒军前锋尽溃。"]},
  "3":{t:"追奔龙凑",d:"初平二年·战后",p:["瓒军大溃,退保界桥复整军再战,又为麹义所破;义乘胜追奔,拔其营、拔其牙门,瓒众星散北走。战中袁绍尝为瓒散骑所围,矢下如雨,绍以强弩力射,仅得脱险。","其后瓒收余众复战于龙凑,又败,遂退守幽州,不复南向。自是河北之势尽归袁绍。瓒退保易京,凿堑筑楼,坐困而亡。"]}
};
const CITY={
  jieqiao:{t:"界桥",d:"决战地,今河北威县东",p:["以跨清河之桥得名。袁绍拒公孙瓒于此,麹义先登破白马义从,斩严纲,遂定河北之局。"]},
  ye:{t:"邺",d:"袁绍治所,今河北临漳西南",p:["冀州魏郡治,袁绍据冀州后经营之根本。界桥之捷,巩固其河北基业。"]},
  ji:{t:"蓟",d:"公孙瓒本据,幽州治,今北京城西南",p:["幽州治所,公孙瓒起兵之地。瓒破黄巾威震河朔,自此南下争冀州。"]},
  pingyuan:{t:"平原",d:"瓒南据之地,今山东平原一带",p:["公孙瓒南略冀州诸城时所据要地,亦其部将屯戍之所。刘备尝为平原相属焉。"]},
  longcou:{t:"龙凑",d:"瓒再败处,今山东德州东北",p:["界桥败后,公孙瓒收众复战于此,又为袁绍所破,遂退守幽州,不复南争。"]},
  qinghe:{t:"清河",d:"清河国,今河北清河一带",p:["清河国治所所在,界桥所跨之清河即由此得名,乃两军对峙之水道。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>

    <p><span class="n">注二</span>合肥在今安徽合肥,逍遥津在其城北施水渡口;濡须在巢湖入江之口,寿春在北为曹魏淮南根本,建业(今南京)为孙权治所。</p>

<script>
const PH={
  all:{t:"十万围合肥",d:"汉建安二十年(215)八月",p:["建安二十年,曹操西征张鲁,淮南空虚。孙权乘虚,亲率大众十万,自濡须北上,进围合肥。时守将张辽、乐进、李典兵才七千,众寡悬绝。","操未行,先以函教付护军薛悌,题其函曰“贼至乃发”。及权至,发之,教曰:“若孙权至者,张、李将军出战,乐将军守,护军勿得与战。”诸将疑之,张辽独慨然请依教出击,以折其锋。"]},
  "1":{t:"八百陷阵",d:"建安二十年八月",p:["权军初至,列营合肥城下。张辽夜募敢死之士八百人,椎牛飨士,以待旦。平旦,辽被甲持戟,先登陷阵,大呼己名,冲垒入,直至权麾下,叱之。","权大惊,不知所为,走登高冢,以长戟自守。辽叱权下战,权不敢动;辽麾左右突围,复还救余众,驰突数四,自旦至日中,吴人夺气。辽乃还城修守备,众心始安。"]},
  "2":{t:"相持退兵",d:"建安二十年八月",p:["张辽既挫其锐,吴军气沮。权攻合肥十余日,城坚不可拔,又会军中大疫,乃议引军还。","诸军以次先发,孙权与吕蒙、甘宁、凌统及诸将亲兵千余人为殿后,次于逍遥津之北,将济施水而南。"]},
  "3":{t:"逍遥津追",d:"建安二十年八月",p:["张辽觇望,知权军已还而殿后兵少,乃率步骑掩击津北。吴军猝不及防,遂大乱。甘宁厉声问鼓吹何以不作,壮气毅然;凌统率亲近扞卫,与魏兵死战。","权乘骏马上津桥,桥南已撤板丈余,谷利著鞭,权乃腾跃而过得免。凌统还身还战,左右尽没,统被创,仅以身还。江东为之夺气,自是魏人以“张辽”之名止小儿夜啼。"]}
};
const CITY={
  hefei:{t:"合肥",d:"曹魏扬州治,今安徽合肥",p:["魏淮南要冲,张辽、乐进、李典以七千守之,为决战之城。孙权以十万围攻十余日不能下。"]},
  xiaoyaojin:{t:"逍遥津",d:"合肥城北施水渡口",p:["孙权殿后处,几为张辽所擒。权乘骏马腾跃过津桥而免,桥南板已撤丈余,江东夺气之地。"]},
  ruxu:{t:"濡须",d:"巢湖入江之口,今安徽无为东北",p:["孙吴北出淮南之来路。权自此溯濡须、经巢湖北上围合肥,兵败亦由此退。"]},
  chaohu:{t:"巢湖",d:"合肥南之大泽",p:["施水肥水所注,吴军水陆经巢湖趋合肥。巢湖濡须一线为魏吴之界。"]},
  shouchun:{t:"寿春",d:"今安徽寿县",p:["曹魏淮南根本,北援之基地。合肥受围时,援军自寿春方面赴之。"]},
  jianye:{t:"建业",d:"今江苏南京",p:["孙权治所,江东之本。围合肥之师自此发,逍遥津败还亦归于此。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>

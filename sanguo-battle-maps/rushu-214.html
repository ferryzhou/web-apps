    <div class="sub">汉建安十六年至十九年(211–214)　　<i>刘备</i> 取益州 · 灭 <b>刘璋</b></div>
  </header>

  <div class="mapwrap">
  <svg class="map" viewBox="0 0 1000 640" role="img" aria-label="刘备入蜀之战形势图,含刘璋刘备疆界、长江三峡涪江与成都雒城江陵等城邑">

      <g class="city" data-city="luocheng"><circle cx="330" cy="320" r="5"/><text class="cname" x="342" y="316">雒城</text></g>
      <g class="city" data-city="fucheng"><circle cx="384" cy="238" r="5"/><text class="cname" x="396" y="234">涪城</text></g>
      <g class="city" data-city="jiameng"><circle cx="378" cy="130" r="4"/><text class="cname s" x="386" y="126">葭萌</text></g>
      <g class="city" data-city="jiangzhou"><circle cx="500" cy="450" r="5"/><text class="cname" x="474" y="472">江州</text></g>
      <g class="city" data-city="jiangling"><circle cx="880" cy="368" r="6"/><text class="cname" x="828" y="364">江陵<tspan class="cname s" dx="2">(荆州)</tspan></text></g>
    </g>

    <!-- 全图 · 应邀入川 -->
    <g id="phAll" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 872,374 C 760,414 660,442 560,442 C 490,442 430,412 392,258"/>
      <text class="mlabel j" x="560" y="416">刘备自江陵溯江入蜀,璋会于涪城</text>
      <text class="anno" x="640" y="398">璋益其兵,使击张鲁</text>
      <path class="march j" marker-end="url(#aj)" d="M 380,142 C 360,210 340,270 324,308"/>
      <text class="mlabel j" x="200" y="188">备北屯葭萌,厚树恩德以收众心</text>
      <ellipse class="siege" cx="270" cy="380" rx="26" ry="20"/>
      <text class="anno" x="150" y="440">既而构隙,回军南向,合围成都</text>
    </g>

    <!-- 阶段一:葭萌反目 -->
    <g id="ph1" class="ph">
      <rect class="camp" x="374" y="126" width="8" height="8" transform="rotate(45 378 130)"/>
      <text class="mlabel j" x="230" y="112">备北屯葭萌,收众心</text>
      <path class="march j" marker-end="url(#aj)" d="M 376,146 C 372,182 378,212 384,230"/>
      <text class="mlabel j" x="392" y="180">回军南向,袭斩杨怀、高沛</text>
      <path class="march j" marker-end="url(#aj)" d="M 384,244 C 380,270 372,296 340,314"/>
      <text class="mlabel j" x="300" y="272">进据涪城</text>
      <text class="anno" x="470" y="300">璋会备于涪城,推行大司马,益兵击张鲁</text>
    </g>

    <!-- 阶段二:雒城苦战 -->
    <g id="ph2" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 380,250 C 368,278 352,300 338,314"/>
      <text class="mlabel j" x="356" y="286">进围雒城</text>
      <circle class="star" cx="330" cy="320" r="9"/>
      <text class="mlabel q" x="344" y="342">刘循坚守,相持将一年</text>
      <text class="anno" x="300" y="360">军师庞统攻城,中流矢而死</text>
      <path class="march j" marker-end="url(#aj)" d="M 872,374 C 720,420 620,448 512,452"/>
      <text class="mlabel j" x="600" y="440">诸葛、张、赵自荆州溯江西上</text>
      <path class="march j" marker-end="url(#aj)" d="M 490,448 C 440,430 400,388 348,332"/>
      <text class="anno" x="410" y="428">分定江州、江阳、德阳诸郡,来会</text>
    </g>

    <!-- 阶段三:围成都·璋降 -->
    <g id="ph3" class="ph">
      <path class="march j" marker-end="url(#aj)" d="M 328,332 C 316,346 300,360 288,372"/>
      <ellipse class="siege" cx="270" cy="380" rx="30" ry="23"/>
      <text class="mlabel j" x="140" y="360">诸军合围成都数十日</text>
      <path d="M 270,380 l 5,-11 l 4,8 l 9,-5 l -5,9 l 11,4 l -11,4 l 5,9 l -9,-5 l -4,8 l -5,-11 l -9,5 l 5,-9 l -11,-4 l 11,-4 l -5,-9 z" fill="#1f4e54" stroke="#e9dec4" stroke-width=".8"/>
      <text class="mlabel q" x="150" y="418">城中精兵三万,谷帛支一年</text>
      <text class="anno" x="200" y="436">璋不忍复战,开城出降,益州入备</text>
    </g>

    <g class="compass" transform="translate(944,560)">
      <circle r="20" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <path d="M 0,-20 L 4,0 L 0,16 L -4,0 Z" fill="var(--ink2)"/>
      <path d="M 0,20 L 4,0 L -4,0 Z" fill="none" stroke="var(--ink2)" stroke-width="1"/>
      <text x="-4" y="-24">北</text>
    </g>
  </svg>
  </div>
  <div class="legend">
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#1f4e54" stroke-width="3"/></svg>刘备军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#9a2b1e" stroke-width="3"/></svg>刘璋军</span>
    <span class="item"><svg width="34" height="10"><line x1="2" y1="5" x2="32" y2="5" stroke="#7a5a23" stroke-width="2.6" stroke-dasharray="3 6"/></svg>降/守</span>
    <span class="item"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#9c7a2c" stroke-width="2"/></svg>苦战</span>

    <span class="item"><svg width="34" height="12"><rect width="34" height="12" fill="url(#jinHatch)"/></svg>刘备</span>

  <div class="panel" id="panel" aria-live="polite"></div>
  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《三国志·先主传》《刘璋传》《庞统传》《诸葛亮传》约略绘出。疆界、长江三峡及涪江水道经简化,点划"约界"以三峡为限,非实有画界。</p>
    <p><span class="n">注二</span>雒城在今四川广汉,涪城在今绵阳,葭萌在今广元,江州在今重庆。诸城相去,依水陆道里略示方位。</p>
    <p><span class="n">注三</span>庞统实死于雒城流矢,后世"落凤坡"之说乃《三国演义》附会,不见于正史。刘璋以爱民之心开城出降,益州遂为刘备之基业,隆中"跨有荆益"之图至是半成。</p>

<script>
const PH={
  all:{t:"应邀入川",d:"汉建安十六年至十九年(211–214)",p:["刘璋闻曹操将取汉中,惧张鲁为患,用张松、法正之谋,迎刘备入川以拒张鲁。备自江陵溯江西上入蜀,璋会之于涪城,益其兵、使击张鲁。","备北屯葭萌,未即讨鲁,而厚树恩德,以收众心。既而与璋构隙,乃回军南向,与诸葛亮、张飞、赵云水陆并进,长驱合围成都。"]},
  "1":{t:"葭萌反目",d:"建安十六年至十七年",p:["刘璋会刘备于涪城,推行大司马、领司隶校尉,益其兵众,使北击张鲁;备遂北屯葭萌,厚树恩德,以收众心,而未即进讨。","既而与璋构隙,备乃回军南向,袭斩璋将杨怀、高沛,尽收其众,进据涪城——由是宾主反目,兵锋直指成都。"]},
  "2":{t:"雒城苦战",d:"建安十八年至十九年",p:["备进围雒城,璋子刘循坚守,相持将一年,城久不下。军师中郎将庞统率众攻城,中流矢而死,备痛惜之(后世附会为“落凤坡”,非正史所载)。","诸葛亮、张飞、赵云自荆州溯江西上,分定江州、江阳、德阳诸郡,克巴东、下巴郡,来会于成都。荆益之师,水陆并进。"]},
  "3":{t:"围成都·璋降",d:"建安十九年(214)",p:["诸军合围成都数十日。城中尚有精兵三万,谷帛可支一年,吏民咸欲死战。","璋曰:“父子在州二十余年,无恩德以加百姓,百姓攻战三年,肌膏草野者,以璋故也,何心能安!”遂开城出降。益州入于刘备,基业始定。"]}
};
const CITY={
  chengdu:{t:"成都",d:"刘璋治所,益州都城",p:["诸军合围数十日。城中精兵三万、谷帛支一年,吏民欲死战;刘璋不忍复战,开城出降,益州遂入刘备。"]},
  luocheng:{t:"雒城",d:"成都之北,今四川广汉",p:["苦战之地。刘璋子刘循坚守,相持将一年;军师庞统率众攻城,中流矢而死。"]},
  fucheng:{t:"涪城",d:"成都东北,今四川绵阳",p:["刘璋会刘备于此,益兵使击张鲁;后备反目回军,袭斩杨怀、高沛而进据之。"]},
  jiameng:{t:"葭萌",d:"益州北门,今四川广元",p:["刘备初屯之地。备不即讨张鲁,而厚树恩德,以收众心;既与璋构隙,乃自此回军南向。"]},
  jiangzhou:{t:"江州",d:"益州东部要冲,今重庆",p:["诸葛亮、张飞、赵云自荆州溯江西上会师之处。张飞于此义释严颜,遂分定诸郡,来会成都。"]},
  jiangling:{t:"江陵",d:"荆州治所,今湖北荆州",p:["刘备入蜀所自出。诸葛亮、张飞、赵云亦自荆州溯江西上,与备会于蜀中。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>

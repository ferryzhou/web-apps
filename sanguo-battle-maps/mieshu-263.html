<script>
const PH={
  all:{t:"三道伐蜀",d:"魏景元四年秋 · 蜀炎兴元年(263)",p:["司马昭欲成不世之功,遣钟会、邓艾、诸葛绪三道伐蜀:钟会统主力十余万自汉中南下,邓艾自狄道趋沓中缀姜维,诸葛绪出武街断其归路。蜀汉承平日久,黄皓用事,不设周备。","姜维自沓中且战且退,间道趋剑阁,合廖化、张翼、董厥诸军,扼天险拒钟会。会攻之不能下,粮运悬远,议欲引还;邓艾乃献偷渡阴平之奇策,出于剑阁之外。"]},
  "1":{t:"剑阁相拒",d:"景元四年九月 — 十月",p:["钟会主力自汉中分道南进,克阳安关口(蜀将蒋舒降、傅佥战死),长驱直趋剑阁。姜维闻阳安已破,自沓中且战且退,与廖化、张翼、董厥合军,退保剑阁。","剑阁一夫当关、万夫莫开。姜维列营据险,钟会攻之累旬不能下。魏军深入,粮运悬远,士卒疲乏,会遂与诸将议:若旷日相持,或当引军而还——蜀之社稷,几系于此天险。"]},
  "2":{t:"偷渡阴平",d:"景元四年十月 — 十一月",p:["邓艾上言:今贼摧折,宜从阴平由邪径出剑阁西,径趋涪、成都,出其空虚之地。遂自阴平行无人之地七百余里,凿山通道,造作桥阁。山高谷深,至为艰险,粮运将匮,几于危殆。","艾以毡自裹,推转而下;将士皆攀木缘崖,鱼贯而进。既出于江油,蜀守将马邈不意魏军自天而降,仓皇出降。奇兵既下,成都门户洞开——七百里绝地,一举而破蜀之藩篱。"]},

const CITY={
  jiange:{t:"剑阁",d:"今四川剑阁,剑门天险",p:["姜维扼此拒钟会,一夫当关,万夫莫开。会攻之不能下,粮运悬远,议欲引还——蜀之门户,守而不失,而国竟先亡。"]},
  yangan:{t:"阳安关",d:"阳平关口,今陕西宁强西北",p:["汉中入蜀之锁钥。蜀将蒋舒出降、傅佥力战而死,关遂陷。钟会由此长驱南下,直趋剑阁。"]},
  tazhong:{t:"沓中",d:"今甘肃舟曲一带",p:["姜维初屯避祸屯田之地。魏军三道并进,邓艾趋沓中缀之;维乃且战且退,间道趋剑阁合军拒守。"]},
  yinping:{t:"阴平",d:"今甘肃文县",p:["邓艾偷渡之起点。自此行无人之地七百余里,凿山通道、造作桥阁,以毡裹身推转而下,遂出江油。"]},
  jiangyou:{t:"江油",d:"今四川平武南",p:["邓艾出阴平所下第一城。守将马邈不意魏军自绝地而至,仓皇出降,成都藩篱由是尽撤。"]},
  mianzhu:{t:"绵竹",d:"今四川德阳",p:["诸葛瞻父子战死处。瞻斩艾诱降之使,列阵力战而败,与子尚俱殉;成都以北再无重兵。"]},
  chengdu:{t:"成都",d:"蜀汉都城",p:["邓艾长驱径至,后主刘禅面缚舆榇出降,并敕姜维等降于钟会。蜀汉立国四十三年而亡。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>

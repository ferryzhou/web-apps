          }
          const sensorR = 16 * scale;
          ctx.save();
          ctx.strokeStyle = ctrlColor || "rgba(226, 232, 240, 0.22)";
          ctx.globalAlpha = ctrlColor ? 0.35 : 0.22;
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(x, y, sensorR, 0, 6.2832); ctx.stroke();
          ctx.restore();
          ctx.fillStyle = ctrlColor || "#cbd5e1";
          ctx.beginPath();
          ctx.moveTo(x, y - 4.4); ctx.lineTo(x + 4.4, y); ctx.lineTo(x, y + 4.4); ctx.lineTo(x - 4.4, y);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#0a0f18"; ctx.lineWidth = 1; ctx.stroke();
        } else if (f.feature === "rock") {
          ctx.fillStyle = "#5b554c";
          ctx.strokeStyle = "rgba(255,255,255,0.22)";
          ctx.lineWidth = 1;
          ctx.fillRect(x - 4.5, y - 3.5, 9, 7);
          ctx.strokeRect(x - 4.5, y - 3.5, 9, 7);
        }
      }
    }

    let lastRenderedItems = []; // for hover hit-testing

    function draw() {
      ctx.clearRect(0, 0, cssW, cssH);
      drawBackdrop();

      const comp = {}, bcomp = {};
      const liveTownHalls = [], liveGasBlds = [], liveBuildings = [];
      const liveGround = [], liveAir = [], deathFlashes = [], liveWorkers = {};

      for (const u of playerUnits) {
        if (u.born > t) continue;
        const dead = u.died >= 0 && t >= u.died;
        if (dead) {
          const dt = t - u.died;
          if (dt <= MM_FLASH) {
            const p = posAt(u, u.died);
            if (p) deathFlashes.push({ x: sx(p[0]), y: sy(p[1]), dt, big: u.isTownHall || u.size >= 3 });
          }
          continue;
        }
        if (!u.structure && u.isWorker && u.type !== "MULE" && u.pid > 0)
          liveWorkers[u.pid] = (liveWorkers[u.pid] || 0) + 1;
        const p = posAt(u, t); if (!p) continue;
        const x = sx(p[0]), y = sy(p[1]);
        const item = { u, x, y, wx: p[0], wy: p[1], angle: p[2] };

        if (u.structure) {
          const building = u.done > u.born && t < u.done;
          item.building = building;
          item.prog = building ? Math.max(0, Math.min(1, (t - u.born) / (u.done - u.born))) : 1;
          liveBuildings.push(item);
          if (u.isTownHall) liveTownHalls.push({ x, y, color: u.color, building });
          if (u.isGasBld) liveGasBlds.push(item);
          let bc = bcomp[u.pid] || (bcomp[u.pid] = {});
          (bc[u.type] || (bc[u.type] = { n: 0, size: u.size, shape: "building" })).n++;
        } else {
          if (u.isAir) liveAir.push(item);
          else liveGround.push(item);
          if (!u.isWorker && u.pid > 0) {
            let c = comp[u.pid] || (comp[u.pid] = {});
            (c[u.type] || (c[u.type] = { n: 0, size: u.size, shape: u.isAir ? "air" : "ground" })).n++;
          }
        }
      }

      // Layer 1: Creep & base territory
      if (layers.territory) drawCreepAndTerritory(liveTownHalls);

      // Layer 2: Neutral map features
      if (layers.features) drawFeatures(liveGround.concat(liveAir), liveGasBlds);

      // Layer 3: Smooth curved movement trails behind moving army units
      if (layers.trails) {
        ctx.save();
        ctx.lineWidth = 1.25;
        ctx.lineCap = "round";
        for (const list of [liveGround, liveAir]) {
          for (const item of list) {
            if (item.u.isWorker || item.angle == null) continue;
            const p1 = posAt(item.u, Math.max(item.u.born, t - 2));
            const p2 = posAt(item.u, Math.max(item.u.born, t - 4.5));
            const p3 = posAt(item.u, Math.max(item.u.born, t - 7));
            if (!p1 || !p2 || !p3) continue;
            const x3 = sx(p3[0]), y3 = sy(p3[1]);
            if (Math.hypot(item.x - x3, item.y - y3) < 2.2) continue;
            ctx.strokeStyle = item.u.color;
            ctx.globalAlpha = 0.28;
            ctx.beginPath();
            ctx.moveTo(x3, y3);
            ctx.lineTo(sx(p2[0]), sy(p2[1]));
            ctx.lineTo(sx(p1[0]), sy(p1[1]));
            ctx.lineTo(item.x, item.y);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      // Layer 4: Buildings (including under-construction progress fill)
      for (const item of liveBuildings) {
        const { u, x, y, building, prog } = item;
        const h = MM_BLD_H[u.size] || 3.8;
        if (building) {
          ctx.save();
          ctx.fillStyle = u.color;
          ctx.globalAlpha = 0.22;
          ctx.fillRect(x - h, y - h, 2 * h, 2 * h);
          // Rising progress fill
          const fh = 2 * h * prog;
          ctx.globalAlpha = 0.65;
          ctx.fillRect(x - h, y + h - fh, 2 * h, fh);
          ctx.globalAlpha = 0.85;
          ctx.lineWidth = 1; ctx.strokeStyle = "#ffffff";
          ctx.setLineDash([2, 2]);
          ctx.strokeRect(x - h + 0.5, y - h + 0.5, 2 * h - 1, 2 * h - 1);
          ctx.restore();
        } else {
          ctx.fillStyle = u.color;
          ctx.fillRect(x - h, y - h, 2 * h, 2 * h);
          ctx.lineWidth = u.isTownHall ? 1.3 : 1;
          ctx.strokeStyle = u.isTownHall ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,0.5)";
          ctx.strokeRect(x - h + 0.5, y - h + 0.5, 2 * h - 1, 2 * h - 1);
        }
      }

      // Layer 5: Ground units, then Air units on top
      for (const list of [liveGround, liveAir]) {
        for (const item of list) {
          const { u, x, y, angle } = item;
          const r = MM_UNIT_R[u.size] || 2.5;
          ctx.fillStyle = u.color;
          unitShape(ctx, x, y, r, u.isAir, angle);
          ctx.fill();
          if (u.size >= 3 || u.isAir) {
            ctx.lineWidth = 0.9;
            ctx.strokeStyle = u.size >= 3 ? "rgba(255,255,255,0.65)" : "rgba(10,15,24,0.7)";
            ctx.stroke();
          }
        }
      }

      // Layer 6: Death rings
      for (const f of deathFlashes) {
        const r = (f.big ? 5 : 3) + f.dt * (f.big ? 13 : 9);
        const alpha = 1 - f.dt / MM_FLASH;
        ctx.strokeStyle = f.big ? `rgba(251,146,60,${alpha.toFixed(3)})` : `rgba(255,90,90,${alpha.toFixed(3)})`;
        ctx.lineWidth = f.big ? 2.5 : 1.8;
        ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 6.2832); ctx.stroke();
      }

      // Save for hover tooltip
      lastRenderedItems = liveAir.concat(liveGround, liveBuildings);
      if (hoverPt) drawHoverReticle();

      updateStats(liveWorkers);
      updateComposition(comp, bcomp);
      syncPlayhead(t);
    }

    function drawHoverReticle() {
      if (!hoverPt) return;
      const { mx, my } = hoverPt;
      const nearby = [];
      for (const item of lastRenderedItems) {
        if (Math.hypot(item.x - mx, item.y - my) <= 13) nearby.push(item);
      }
      if (!nearby.length && layers.features) {
        for (const f of features) {
          if (f.born > t || (f.died >= 0 && t >= f.died)) continue;
          const p = f.moves[0], fx = sx(p[1]), fy = sy(p[2]);
          if (Math.hypot(fx - mx, fy - my) <= 12) nearby.push({ u: f, x: fx, y: fy });
        }
      }
      if (!nearby.length) { tipEl.style.opacity = 0; return; }

      // Subtle hover ring on canvas
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(mx, my, 12, 0, 6.2832); ctx.stroke();
      ctx.restore();

      // Tally unit types near cursor
      const tally = new Map();
      for (const it of nearby) {
        const key = it.u.owner + " · " + it.u.type;
        tally.set(key, (tally.get(key) || 0) + 1);
      }
      const rows = [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4);
      tipEl.innerHTML = rows.map(([k, n]) =>
        `<div>${n > 1 ? `<strong>${n}×</strong> ` : ""}${escapeHtml(k)}</div>`
      ).join("");
      tipEl.style.left = Math.max(48, Math.min(cssW - 48, mx)) + "px";
      tipEl.style.top = Math.max(36, my) + "px";
      tipEl.style.opacity = 1;
    }

    function fmt(s) { const m = Math.floor(s / 60); return m + ":" + String(Math.floor(s % 60)).padStart(2, "0"); }
    function updateUI() {
      scrub.value = Math.round((t / duration) * 1000);
      const cur = fmt(t);
      timeEl.textContent = cur + " / " + fmt(duration);
      if (hudClockEl) hudClockEl.textContent = cur;
    }
    function setPlaying(v) {
      playing = v; playBtn.textContent = v ? "❚❚" : "▶";
      if (v) { lastTs = 0; raf = requestAnimationFrame(step); }
      else if (raf) { cancelAnimationFrame(raf); raf = 0; }
    }
    function step(ts) {
      if (!playing) return;
      if (lastTs) { t += ((ts - lastTs) / 1000) * speed; }
      lastTs = ts;
      if (t >= duration) { t = duration; setPlaying(false); }
      draw(); updateUI();
      if (playing) raf = requestAnimationFrame(step);
    }
    function seek(newT) {
      t = Math.max(0, Math.min(duration, newT));
      draw(); updateUI();
    }

    // events
    const onPlay = () => { if (t >= duration) t = 0; setPlaying(!playing); };
    const onScrub = () => { if (playing) setPlaying(false); seek((scrub.value / 1000) * duration); };
    const onSpeed = (e) => {
      const b = e.target.closest("button[data-s]"); if (!b) return;
      speed = +b.dataset.s;
      speedEl.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    };
    const onToggle = (e) => {
      const b = e.target.closest("button[data-layer]"); if (!b) return;
      const k = b.dataset.layer;
      layers[k] = !layers[k];
      b.classList.toggle("active", layers[k]);
      if (k === "hud") { hudEl.classList.toggle("hidden", !layers.hud || !statsPlayers.length); return; }
      draw();
    };
    const onEventClick = (e) => {
      const m = e.target.closest(".mm-ev[data-t]"); if (!m) return;
      if (playing) setPlaying(false);
      seek(Number(m.dataset.t));
    };
    const onMouseMove = (e) => {
      const r = canvas.getBoundingClientRect();
      hoverPt = { mx: e.clientX - r.left, my: e.clientY - r.top };
      draw();
    };
    const onMouseLeave = () => { hoverPt = null; tipEl.style.opacity = 0; draw(); };
    const onKeyDown = (e) => {
      if (e.target && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target.tagName)) return;
      if (!playbackEl.classList.contains("active")) return;
      if (e.code === "Space") { e.preventDefault(); onPlay(); }
      else if (e.code === "ArrowRight") { e.preventDefault(); seek(t + 5); }
      else if (e.code === "ArrowLeft") { e.preventDefault(); seek(t - 5); }
    };

    playBtn.addEventListener("click", onPlay);
    scrub.addEventListener("input", onScrub);
    speedEl.addEventListener("click", onSpeed);
    togglesEl.addEventListener("click", onToggle);
    eventsEl.addEventListener("click", onEventClick);
    canvas.addEventListener("mousemove", onMouseMove);
    canvas.addEventListener("mouseleave", onMouseLeave);
    window.addEventListener("keydown", onKeyDown);
    const ro = new ResizeObserver(fit); ro.observe(canvas.parentElement);

    fit(); updateUI();
    return {
      seek,
      fit,
      destroy() {
        setPlaying(false); ro.disconnect();
        playBtn.removeEventListener("click", onPlay);
        scrub.removeEventListener("input", onScrub);
        speedEl.removeEventListener("click", onSpeed);
        togglesEl.removeEventListener("click", onToggle);
        eventsEl.removeEventListener("click", onEventClick);
        canvas.removeEventListener("mousemove", onMouseMove);
        canvas.removeEventListener("mouseleave", onMouseLeave);
        window.removeEventListener("keydown", onKeyDown);
      },
    };
  }

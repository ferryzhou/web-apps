      <text class="mlabel q" x="90" y="200">麹文泰恃碛险、结西突厥,绝贡道、扣唐使</text>
      <text class="anno" x="150" y="350">谓"唐兵必不能至",不设备</text>

      <text class="anno" x="150" y="322">子智盛嗣立,仓皇拒守</text>

      <text class="mlabel j" x="316" y="368">侯君集先拔田地城,俘男女七千</text>

      <text class="anno" x="150" y="248">昼夜攻之,城中震恐</text>

    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷一九五、《旧唐书·高昌传》《侯君集传》约略绘出。疆界、水道、碛境经简化,城邑方位取其大略,非实测地图。</p>
    <p><span class="n">注二</span>高昌都城、交河故城在今新疆吐鲁番,莫贺延碛即今哈顺戈壁(伊州以东大漠);伊吾即今哈密,可汗浮图城在今吉木萨尔一带,为西突厥所遣援军所屯。</p>
    <p><span class="n">注三</span>灭高昌、置西州与安西都护府,为唐直辖西域、经营丝路之始;然侯君集私取宝物、纵兵掠夺,归而下狱,亦伏后日谋反之衅。</p>

<script>
const PH={
  all:{t:"冒碛西征",d:"唐贞观十三年 — 十四年(639–640)",p:["高昌王麹文泰恃碛卤之险、结西突厥为援,绝西域贡道、扣留唐使、遏绝商旅。贞观十三年,太宗命侯君集为交河道行军大总管,薛万均、契苾何力等副之,率步骑数万,冒碛西讨高昌。","碛卤广七百里,水草乏绝,人马艰行。文泰恃唐军不能远涉,谓左右曰:“唐去我七千里,沙碛阔二千里,地无水草,寒风如刀,热风如烧,安能致大兵乎?”故不为之备。及闻唐军已度碛,惶骇无策。"]},
  "1":{t:"度碛兵临",d:"贞观十四年(640)",p:["唐军出敦煌、玉门,涉莫贺延碛而西,历伊吾进逼高昌。碛中风沙酷烈,君集勒兵疾行,竟越七百里之绝地而至。","文泰本谓唐兵必不能至,不设守备;闻唐军已度碛,忧惧交并,发病而卒(一说病死),子智盛仓皇嗣立,始敛兵拒守,而众心已摇。"]},
  "2":{t:"拔田地·围都城",d:"贞观十四年(640)",p:["侯君集进军,先拔田地城,俘获男女七千,高昌屏障尽失。乃移兵进围都城,列营环之。","唐军作抛车飞石,巢车高十丈以瞰城中,矢石雨下,又以撞车毁其堞。昼夜攻之,城中人物皆震恐,高昌上下夺气。"]},
  "3":{t:"智盛出降·置西州",d:"贞观十四年(640)",p:["西突厥可汗先遣兵屯可汗浮图城以为声援,及见唐军威盛,惧而请降,高昌外援遂绝,孤城无所恃。","麹智盛计穷,开门出降,高昌遂亡,凡三郡、五县、二十二城入唐。太宗以其地置西州,又置安西都护府于交河——中原经营西域、控扼丝路之门户,自此而开。"]}
};
const CITY={
  jiaohe:{t:"交河·高昌都城",d:"今新疆吐鲁番",p:["麹氏高昌之都,亦置交河城。侯君集围之,作抛车、巢车昼夜攻击;麹智盛开门出降。唐后置安西都护府于交河。"]},
  tiandi:{t:"田地城",d:"高昌东境要邑",p:["高昌都城之东屏。侯君集进军先拔此城,俘男女七千,高昌门户遂洞开。"]},
  yiwu:{t:"伊吾",d:"今新疆哈密",p:["西域东端要地,唐军度碛西进所经。贞观四年伊吾已内附置西伊州,为唐军西向之前进跳板。"]},
  futu:{t:"可汗浮图城",d:"西突厥援军所屯,今吉木萨尔一带",p:["西突厥可汗遣兵屯此以援高昌。及睹唐军威盛,惧而降,高昌外援遂绝,孤危无恃。"]},
  mohe:{t:"莫贺延碛",d:"七百里大漠,今哈顺戈壁",p:["横亘唐与高昌之间的绝碛,广七百里,无水草,寒热风如刀如烧。文泰恃此以为唐兵必不能至;君集竟冒碛而度,遂出其不意。"]},
  yumen:{t:"玉门关",d:"今甘肃敦煌西",p:["河西通西域之关隘。唐军出敦煌、越玉门,由此入碛西征,为度碛前之最后重镇。"]},
  liangzhou:{t:"凉州",d:"河西重镇,今甘肃武威",p:["河西节度所资、军兴转输之地。唐军西征,粮械多取给于河西诸州,凉州为其枢要。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>

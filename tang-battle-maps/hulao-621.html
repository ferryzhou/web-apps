    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷一八九、《旧唐书·太宗纪》《窦建德传》《王世充传》约略绘出。城邑水道经简化,疆界为武德四年中原形势之约略示意,非实有画界。</p>
    <p><span class="n">注二</span>虎牢(唐避讳作武牢)在今河南荥阳汜水镇,扼洛阳东出之险;汜水为其东侧小河,南来入黄河,即两军决战之地。</p>
    <p><span class="n">注三</span>此役"围点打援、一战擒两王",平郑灭夏、底定中原,为唐统一战争之枢机。世民先据汜水之险、疲敌诱之,继以玄甲军卷阵之术破之,为其代表战法。</p>

};

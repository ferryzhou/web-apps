      <text class="anno" x="150" y="170">薛举称西秦霸王,兵锋方锐</text>

      <text class="anno" x="540" y="410">相持六十余日,纵反间、绝其粮道以老其师</text>
      <text class="anno" x="430" y="256">七月薛举死,子仁杲立,军心渐离</text>

  <div class="notes">
    <p><span class="n">注一</span>本图为示意图,依《资治通鉴》卷一八五至一八六、《旧唐书·太宗纪》《薛举传》约略绘出。疆界、水道经简化,城邑为相对示意:高墌今陕西长武,折墌城在泾川,浅水原在长武一带。</p>
    <p><span class="n">注二</span>第一次浅水原(618年七月)唐实败:时世民方病,委军于诸将,刘文静、殷开山等违令出战,为薛举所破。此图所绘为十一月世民反攻、坚壁致胜之役。</p>
    <p><span class="n">注三</span>浅水原在今陕西长武一带,折墌城在泾川。世民“坚壁疲敌、俟衅而动”为其早年用兵之范式——不与锐师争锋,而待其粮尽气惰,一举破之。</p>

const PH={
  all:{t:"薛举逼关",d:"武德元年(618)",p:["薛举父子起于金城,据陇右,称西秦霸王,拥劲骑,屡寇泾州、扶风,兵锋直逼长安。唐新定关中,西陲未靖,以此为腹心之患。","高祖遣秦王世民西拒之,军于高墌。六月世民方病,委军诸将,刘文静等违令浪战,大败于浅水原(第一次浅水原,唐败);七月薛举死,子薛仁杲立。"]},

  zhezhi:{t:"折墌城",d:"泾州治,今甘肃泾川,薛仁杲都",p:["薛仁杲所都。世民自率轻骑穷追至城下,将卒逾城来降,仁杲出降,西秦亡。"]},
  jingzhou:{t:"泾州",d:"今甘肃泾川一带",p:["西秦东出寇唐之要冲,亦折墌所在之州。陇右既平,尽入唐土。"]},
  longshan:{t:"陇山",d:"关中与陇右之界山",p:["关陇分隔之险。西秦据陇山以西之陇右,东与唐争关中,山为天堑。"]}
};
const panel=document.getElementById('panel');
function render(o){panel.innerHTML='<h2>'+o.t+'</h2><div class="date">'+o.d+'</div>'+o.p.map(x=>'<p>'+x+'</p>').join('');}
const tabs=[...document.querySelectorAll('.tabs button')];
function setPhase(p){
  document.body.dataset.ph=p;
  tabs.forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  document.querySelectorAll('.city').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll('.ph').forEach(g=>g.classList.remove('show'));
  const g=document.getElementById(p==='all'?'phAll':'ph'+p);
  if(g){void g.getBoundingClientRect();g.classList.add('show');}
  render(PH[p]);
}
tabs.forEach(b=>b.addEventListener('click',()=>setPhase(b.dataset.p)));
document.querySelectorAll('.city').forEach(c=>{c.addEventListener('click',()=>{const info=CITY[c.dataset.city];if(!info)return;document.querySelectorAll('.city').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');render(info);});});
setPhase('all');
</script>
</div>
</body>
